<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Infallible Pump Gallery</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Layout: a bench. Rail of five pumps left, viewport centre, spec sheet right; stacks to one column on phones. */
      :root {
        --bg: #eef0f3;
        --surface: #ffffff;
        --viewport: #e4e7ec;
        --fg: #171a1f;
        --muted: #5c6470;
        --line: #d6dae1;
        --accent: #0f66d0;
        --accent-ink: #ffffff;
        --chip: #e3ecf9;
        --chip-ink: #0d4a9a;
        --font-display: 'Archivo', 'Segoe UI', Roboto, sans-serif;
        --font-body: 'IBM Plex Sans', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1216;
          --surface: #171b21;
          --viewport: #1c2129;
          --fg: #e8ebf0;
          --muted: #99a3b1;
          --line: #2a313c;
          --accent: #5ea3ff;
          --accent-ink: #0a1526;
          --chip: #1e2b40;
          --chip-ink: #a9c8ff;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1216;
        --surface: #171b21;
        --viewport: #1c2129;
        --fg: #e8ebf0;
        --muted: #99a3b1;
        --line: #2a313c;
        --accent: #5ea3ff;
        --accent-ink: #0a1526;
        --chip: #1e2b40;
        --chip-ink: #a9c8ff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 var(--font-body);
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        padding-inline: 16px;
        padding-block: 12px 16px;
        gap: 12px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 18px;
      }
      h1 {
        margin: 0;
        font: 700 22px/1.1 var(--font-display);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      .bench {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr) 300px;
        gap: 12px;
        min-height: 0;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
        min-height: 0;
      }
      .card {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        align-items: center;
        padding: 8px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--muted);
      }
      .card[aria-pressed='true'] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .card:focus-visible,
      .tb button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .card img {
        width: 56px;
        height: 66px;
        object-fit: contain;
        border-radius: 6px;
        background: var(--viewport);
      }
      .card .name {
        font: 600 14px/1.2 var(--font-display);
      }
      .card .maker {
        color: var(--muted);
        font-size: 12px;
      }
      .chip {
        display: inline-block;
        margin-top: 4px;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--chip-ink);
        font: 500 11px/1.6 var(--font-body);
        letter-spacing: 0.02em;
      }
      .stage {
        position: relative;
        min-width: 0;
        min-height: 320px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--viewport);
        overflow: hidden;
      }
      .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      .stage canvas:active {
        cursor: grabbing;
      }
      .tb {
        position: absolute;
        left: 10px;
        top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tb button {
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--fg);
        font: 500 12px/1.4 var(--font-body);
        cursor: pointer;
      }
      .tb button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .tb button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .hint {
        position: absolute;
        right: 12px;
        bottom: 10px;
        color: var(--muted);
        font: 400 11px/1.4 var(--font-mono);
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }
      .spec {
        overflow: auto;
        min-height: 0;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .spec h2 {
        margin: 0;
        font: 700 20px/1.15 var(--font-display);
        text-wrap: balance;
      }
      .spec .maker {
        color: var(--muted);
        margin: 2px 0 12px;
      }
      .spec dl {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 8px 10px;
        margin: 0;
      }
      .spec dt {
        color: var(--muted);
        font: 500 11px/1.6 var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .spec dd {
        margin: 0;
        min-width: 0;
      }
      .spec dd.mono {
        font: 500 13px/1.5 var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .spec .foot {
        margin: 14px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 900px) {
        .app {
          height: auto;
        }
        .bench {
          grid-template-columns: 1fr;
        }
        .rail {
          flex-direction: row;
          overflow-x: auto;
          padding-bottom: 4px;
        }
        .card {
          grid-template-columns: 44px 1fr;
          flex: 0 0 200px;
        }
        .card img {
          width: 44px;
          height: 52px;
        }
        .stage {
          aspect-ratio: 4 / 3;
          max-width: 100%;
          min-height: 0;
        }
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Pump Gallery</h1>
        <p>
          Five insulin pumps modelled at 1:1 in millimetres. Drag to orbit, scroll or pinch to zoom.
        </p>
      </header>
      <div class="bench">
        <nav class="rail" id="rail" aria-label="Pumps"></nav>
        <section class="stage" id="stage" aria-label="3D viewport">
          <div class="tb" id="toolbar">
            <button type="button" data-view="front">Front</button>
            <button type="button" data-view="iso">¾</button>
            <button type="button" data-view="back">Back</button>
            <button type="button" data-view="top">Top</button>
            <button type="button" id="phone" aria-pressed="true">Phone</button>
            <button type="button" id="spin" aria-pressed="true">Spin</button>
            <button type="button" id="grid" aria-pressed="true">10 mm grid</button>
          </div>
          <div class="hint">← → switch · space spin · P phone · R reset</div>
        </section>
        <aside class="spec" id="spec" aria-live="polite"></aside>
      </div>
    </div>
    <script type="module" src="gallery.js"></script>
  </body>
</html>

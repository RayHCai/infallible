<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench · Infallible design 04</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* 04 · Workbench — an IDE: navigator tree, always-on 3D viewport, tabbed inspector, status bar. */
      :root {
        --panel: #f3f4f6;
        --editor: #ffffff;
        --line: #e5e7eb;
        --line-2: #d1d5db;
        --text: #111827;
        --text-2: #4b5563;
        --text-3: #9ca3af;
        --blue: #2563eb;
        --blue-bg: #dbeafe;
        --blue-soft: #eff6ff;
        --green: #16a34a;
        --red: #dc2626;
        --amber: #d97706;
        --violet: #7c3aed;
        --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Consolas, Menlo, monospace;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--panel);
        color: var(--text);
        font: 13px/1.45 var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
      ul, ol { padding: 0; list-style: none; }
      button {
        font: inherit; color: inherit; background: none; border: 0; padding: 0;
        cursor: pointer; text-align: left;
      }
      button:disabled { cursor: default; opacity: 0.4; }
      :focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
      code, .mono { font-family: var(--mono); font-size: 12px; }
      .num { font-variant-numeric: tabular-nums; }
      .muted { color: var(--text-2); }

      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 34px 1fr 24px;
      }

      /* title bar */
      .titlebar {
        display: flex; align-items: center; gap: 10px;
        padding: 0 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .logo {
        width: 18px; height: 18px; border-radius: 4px; background: var(--text);
        display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px;
      }
      .titlebar .app-name { font-weight: 600; }
      .titlebar .sep { color: var(--text-3); }
      .titlebar .run-name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
      .pill {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 1px 8px; border-radius: 999px;
        font-size: 11px; font-weight: 600; text-transform: capitalize;
        background: var(--blue-bg); color: var(--blue);
      }
      .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
      body[data-state='evaluating'] .state-pill { background: #fef3c7; color: var(--amber); }
      body[data-state='completed'] .state-pill { background: #dcfce7; color: var(--green); }
      body[data-state='completed'] .state-pill i { animation: none; }
      .titlebar .spacer { flex: 1; }
      .tb-btn {
        height: 24px; padding: 0 10px; border-radius: 4px;
        border: 1px solid var(--line-2); background: var(--editor);
        font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
      }
      .tb-btn:hover { border-color: var(--blue); color: var(--blue); }
      .tb-btn[hidden] { display: none; }
      kbd {
        font-family: var(--mono); font-size: 10px; color: var(--text-3);
        border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px;
      }

      /* workspace */
      .workspace {
        min-height: 0;
        display: grid;
        grid-template-columns: 264px 4px minmax(0, 1fr) 4px 352px;
      }
      .gutter { background: var(--line); cursor: col-resize; transition: background 0.15s; }
      .gutter:hover { background: var(--blue); }
      .pane { min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
      .pane-head {
        height: 30px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 10px;
        font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2);
        border-bottom: 1px solid var(--line);
      }
      .scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

      /* navigator tree */
      .tree { padding: 4px 0 12px; }
      .node {
        width: 100%; height: 26px;
        display: grid; grid-template-columns: 14px 16px 1fr auto; align-items: center; gap: 4px;
        padding-right: 10px;
        white-space: nowrap;
      }
      .node:hover:not(:disabled) { background: #e8eaee; }
      .node.sel { background: var(--blue-bg); box-shadow: inset 2px 0 0 var(--blue); }
      .node .label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .node .meta { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
      .node.group .label { font-weight: 600; font-size: 12px; }
      .chev { width: 14px; height: 14px; display: grid; place-items: center; color: var(--text-3); transition: transform 0.15s; }
      .chev.open { transform: rotate(90deg); }
      .chev.none { visibility: hidden; }
      .d0 { padding-left: 4px; } .d1 { padding-left: 18px; } .d2 { padding-left: 32px; } .d3 { padding-left: 46px; }

      .ic {
        width: 14px; height: 14px; border-radius: 3px; display: inline-grid; place-items: center;
        font-size: 9px; font-weight: 700; color: #fff; background: var(--text-3);
      }
      .ic.done, .ic.passed { background: var(--green); }
      .ic.failed { background: var(--red); }
      .ic.errored { background: var(--amber); }
      .ic.pending, .ic.disabled { background: transparent; border: 1px solid var(--line-2); }
      .ic.active { background: transparent; border: 1.5px solid var(--blue); border-right-color: transparent; border-radius: 50%; animation: spin 0.9s linear infinite; }
      .ic.next { background: var(--blue); }
      .av {
        width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center;
        background: #374151; color: #fff; font-size: 9px; font-weight: 700; position: relative;
      }
      .av.lg { width: 36px; height: 36px; font-size: 15px; }
      .live-dot { position: absolute; right: -2px; bottom: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--green); border: 1.5px solid var(--panel); }
      body:not([data-state='running']) .live-dot { display: none; }
      .score { font-family: var(--mono); font-size: 11px; display: inline-flex; gap: 6px; }
      .score .p { color: var(--green); }
      .score .f { color: var(--red); }
      .spin {
        display: inline-block; width: 9px; height: 9px; border-radius: 50%;
        border: 1.5px solid var(--blue); border-right-color: transparent; animation: spin 0.9s linear infinite; vertical-align: -1px; margin-right: 4px;
      }
      body[data-state='completed'] .spin { display: none; }
      .only-evaluating, .only-completed { display: none !important; }
      body[data-state='evaluating'] .only-evaluating, body[data-state='completed'] .only-completed { display: grid !important; }
      .node.cta .label { color: var(--blue); font-weight: 600; }

      /* center */
      .center { background: var(--editor); }
      .tabs-bar {
        height: 30px; flex-shrink: 0; display: flex; align-items: stretch;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .doc-tab {
        display: flex; align-items: center; gap: 6px; padding: 0 12px;
        background: var(--editor); border-right: 1px solid var(--line);
        box-shadow: inset 0 2px 0 var(--blue); font-size: 12px; white-space: nowrap;
      }
      .doc-tab .mono { color: var(--text-2); font-size: 11px; }
      .viewport {
        position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: grab; user-select: none;
        background:
          radial-gradient(ellipse at 50% 46%, transparent 40%, rgba(17, 24, 39, 0.08) 100%),
          linear-gradient(#fafbfc, #eef0f3);
      }
      .viewport.dragging { cursor: grabbing; }
      .floor {
        position: absolute; left: -30%; right: -30%; bottom: -10%; height: 55%;
        background-image:
          linear-gradient(rgba(37, 99, 235, 0.10) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37, 99, 235, 0.10) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(62deg);
        transform-origin: 50% 0;
        mask-image: linear-gradient(transparent, #000 35%);
        -webkit-mask-image: linear-gradient(transparent, #000 35%);
      }
      .axes { position: absolute; left: 12px; bottom: 12px; }
      .stage-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
      .viewport.has-thumbs .stage-wrap { bottom: 120px; }
      .stage {
        height: 74%; aspect-ratio: 180 / 320; position: relative;
        transform-style: preserve-3d; transition: transform 0.5s var(--ease);
        filter: drop-shadow(0 18px 16px rgba(17, 24, 39, 0.25));
      }
      .stage::after {
        content: ''; position: absolute; left: 10%; right: 10%; bottom: -9%; height: 7%;
        border-radius: 50%; background: radial-gradient(rgba(17, 24, 39, 0.3), transparent 70%);
        transform: translateZ(-40px);
      }
      .stage svg { width: 100%; height: 100%; display: block; }
      .stage .key, .stage .screen text, .stage .fx {
        transition: transform 0.6s var(--ease), opacity 0.4s var(--ease);
        transform-box: fill-box; transform-origin: center;
      }
      .stage .key.pressed rect { fill: var(--blue); }
      .stage .fx { opacity: 0; }
      .viewport.idle .stage { opacity: 0.55; }
      .viewport.after-move_button .key-select { transform: translateY(16px); }
      .viewport.after-resize_text .screen text { transform: scale(1.5); }
      .viewport.after-confirm_dialog .fx-dialog,
      .viewport.after-change_timeout .fx-timeout,
      .viewport.after-add_audio_cue .fx-audio { opacity: 1; }
      .hud {
        position: absolute; top: 10px; font-family: var(--mono); font-size: 11px; color: var(--text-2);
        background: rgba(255, 255, 255, 0.85); border: 1px solid var(--line); padding: 3px 7px; border-radius: 3px;
      }
      .hud.l { left: 10px; } .hud.r { right: 10px; }
      .hint {
        position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
        background: var(--editor); border: 1px solid var(--line-2); border-radius: 6px;
        padding: 10px 14px; text-align: center; box-shadow: 0 6px 20px rgba(17, 24, 39, 0.08);
        pointer-events: none;
      }
      .hint b { display: block; font-size: 13px; }
      .hint span { font-size: 12px; color: var(--text-2); }
      .thumbs {
        position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
        display: flex; justify-content: center; gap: 8px; padding: 10px 12px;
        border-top: 1px solid var(--line); background: rgba(243, 244, 246, 0.92);
        overflow-x: auto; cursor: default;
      }
      .thumbs[hidden], .hint[hidden] { display: none; }
      .thumb {
        width: 128px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--editor);
        display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 6px; align-items: center;
      }
      .thumb:hover { border-color: var(--blue); }
      .thumb svg { width: 34px; height: 60px; display: block; }
      .thumb .t-name { font-size: 11.5px; font-weight: 600; line-height: 1.2; }
      .thumb .t-sub { font-size: 10.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* transport dock */
      .dock {
        flex-shrink: 0; border-top: 1px solid var(--line); background: var(--panel);
        display: grid; grid-template-columns: auto auto 1fr; gap: 6px 10px; align-items: center; padding: 8px 10px;
      }
      .dock[hidden] { display: none; }
      .play {
        width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center;
        background: var(--blue); color: #fff;
      }
      .play:hover { background: #1d4ed8; }
      .dock .pos { font-family: var(--mono); font-size: 11px; color: var(--text-2); min-width: 54px; }
      .dock input[type='range'] { width: 100%; accent-color: var(--blue); cursor: pointer; }
      .chips-row { grid-column: 1 / -1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
      .chips-row button {
        flex-shrink: 0; font-family: var(--mono); font-size: 11px; padding: 2px 7px;
        border: 1px solid var(--line-2); border-radius: 3px; background: var(--editor); color: var(--text-3);
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .chips-row button b { font-weight: 500; margin-right: 5px; opacity: 0.7; }
      .chips-row button.done { color: var(--text); border-color: var(--line-2); background: #e5e7eb; }
      .chips-row button.next { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
      .chips-row button:hover { border-color: var(--blue); }

      /* inspector */
      .itabs { height: 30px; flex-shrink: 0; display: flex; border-bottom: 1px solid var(--line); }
      .itab {
        padding: 0 12px; font-size: 12px; font-weight: 500; color: var(--text-2);
        border-right: 1px solid var(--line); position: relative;
      }
      .itab:hover:not(:disabled) { color: var(--text); background: #e8eaee; }
      .itab.on { color: var(--text); background: var(--editor); }
      .itab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--blue); }
      .inspector .scroll { background: var(--editor); }
      .sec { padding: 12px; border-bottom: 1px solid var(--line); animation: fade 0.25s var(--ease) both; }
      .sec-h {
        font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
        display: flex; justify-content: space-between; margin-bottom: 8px;
      }
      .empty { padding: 28px 16px; color: var(--text-3); text-align: center; }
      .ins-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
      .quote { border-left: 2px solid var(--line-2); padding-left: 10px; color: var(--text-2); font-style: italic; margin-top: 8px; }
      .props { display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; }
      .props dt { color: var(--text-3); font-size: 12px; }
      .codebox {
        display: block; font-family: var(--mono); font-size: 11.5px; background: #f9fafb;
        border: 1px solid var(--line); border-radius: 3px; padding: 5px 7px; word-break: break-word;
      }
      .list-row {
        width: 100%; display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
        padding: 6px 8px; border-radius: 3px;
      }
      .list-row:hover:not(:disabled) { background: var(--panel); }
      .list-row.sel { background: var(--blue-bg); }
      .list-row .meta { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
      .who { display: flex; gap: 10px; align-items: center; }
      .who .name { font-weight: 600; font-size: 14px; }
      .status {
        margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 3px;
        background: #dcfce7; color: var(--green); text-transform: capitalize;
      }
      .mods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
      .mod { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #f3e8ff; color: var(--violet); }
      .mod.none { background: var(--panel); color: var(--text-3); }
      .action { font-size: 20px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; margin: 2px 0 6px; animation: rise 0.3s var(--ease) both; }
      .reason { color: var(--text-2); font-style: italic; border-left: 2px solid var(--blue); padding-left: 10px; }
      .frame { margin-top: 10px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
      .frame svg { display: block; width: 100%; }
      .frame figcaption { font-family: var(--mono); font-size: 11px; color: var(--text-2); padding: 5px 8px; border-top: 1px solid var(--line); background: #f9fafb; }
      .frame figcaption::before { content: '\266A  '; color: var(--blue); }
      .failure { background: #fef2f2; border-left: 3px solid var(--red); }
      .failure .sec-h { color: var(--red); }
      .failure.errored { background: #fffbeb; border-left-color: var(--amber); }
      .failure.errored .sec-h { color: var(--amber); }
      .tag {
        display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        padding: 1px 6px; border-radius: 3px;
      }
      .tag.hardware { background: #f3e8ff; color: var(--violet); }
      .tag.firmware { background: var(--blue-bg); color: var(--blue); }
      .tag.interaction { background: #dcfce7; color: var(--green); }
      .sug-row { grid-template-columns: 82px 1fr; }
      .sug-row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; margin: 10px 0 8px; }
      .seg button { padding: 3px 14px; font-size: 12px; font-weight: 500; color: var(--text-2); }
      .seg button + button { border-left: 1px solid var(--line-2); }
      .seg button.on { background: var(--blue); color: #fff; }

      /* status bar */
      .statusbar {
        display: flex; align-items: center; gap: 0; background: var(--blue); color: #fff;
        font-size: 11.5px; white-space: nowrap; overflow: hidden;
      }
      .statusbar > span { padding: 0 10px; height: 100%; display: inline-flex; align-items: center; gap: 5px; border-right: 1px solid rgba(255, 255, 255, 0.18); }
      .statusbar .grow { flex: 1; border-right: 0; }
      .statusbar .conn i { width: 7px; height: 7px; border-radius: 50%; background: #86efac; }
      body[data-state='evaluating'] .statusbar { background: #b45309; }
      body[data-state='completed'] .statusbar { background: #15803d; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: 0.3; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      }
      @media (max-width: 1280px) {
        .workspace { grid-template-columns: 228px 4px minmax(0, 1fr) 4px 316px; }
      }
    </style>
  </head>
  <body data-state="running">
    <div class="app">
      <header class="titlebar">
        <span class="logo">I</span>
        <span class="app-name">Infallible</span>
        <span class="sep">/</span>
        <span class="run-name">Run <code id="run-id"></code> · started <span id="run-started" class="num"></span></span>
        <span class="pill state-pill"><i></i><span id="run-state"></span></span>
        <span class="spacer"></span>
        <span class="muted num" id="tb-counts"></span>
        <button class="tb-btn" id="back" hidden>&larr; Back <kbd>Esc</kbd></button>
      </header>

      <div class="workspace">
        <aside class="pane">
          <div class="pane-head">Navigator <span class="num" id="nav-count"></span></div>
          <div class="scroll"><ul class="tree" id="tree" role="tree"></ul></div>
        </aside>
        <div class="gutter" aria-hidden="true"></div>

        <section class="pane center">
          <div class="tabs-bar"><div class="doc-tab" id="doc-tab"></div></div>
          <div class="viewport" id="viewport">
            <div class="floor"></div>
            <div class="stage-wrap"><div class="stage" id="stage"></div></div>
            <span class="hud l" id="hud-l"></span>
            <span class="hud r">drag · orbit &nbsp; wheel · zoom</span>
            <svg class="axes" width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
              <path d="M8 30 L30 30" stroke="#dc2626" stroke-width="1.5" /><path d="M8 30 L8 8" stroke="#16a34a" stroke-width="1.5" /><path d="M8 30 L20 20" stroke="#2563eb" stroke-width="1.5" />
            </svg>
            <div class="hint" id="hint"><b>Select a persona or task</b><span>Navigator on the left · or click an agent below</span></div>
            <div class="thumbs" id="thumbs"></div>
          </div>
          <div class="dock" id="dock" hidden>
            <button class="play" id="play" aria-label="Play or pause">
              <svg width="12" height="12" viewBox="0 0 16 16"><path id="play-icon" d="M5 3.5v9M11 3.5v9" stroke="currentColor" stroke-width="2.4" fill="none" /></svg>
            </button>
            <span class="pos num" id="pos"></span>
            <input type="range" id="scrub" min="0" max="10" value="0" aria-label="Scrub steps" />
            <ol class="chips-row" id="chips"></ol>
          </div>
        </section>
        <div class="gutter" aria-hidden="true"></div>

        <aside class="pane inspector">
          <div class="itabs" id="itabs" role="tablist"></div>
          <div class="scroll" id="inspector"></div>
        </aside>
      </div>

      <footer class="statusbar">
        <span><code id="sb-run" style="font-size:11px"></code></span>
        <span id="sb-state"></span>
        <span class="num" id="sb-tasks"></span>
        <span class="num" id="sb-score"></span>
        <span class="grow" id="sb-sel"></span>
        <span class="conn"><i></i>driver ws://localhost:8000</span>
      </footer>
    </div>

    <script src="_shared/mock.js"></script>
    <script>
      const M = window.MOCK;
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const ic = (st) => `<span class="ic ${st}">${st === 'done' || st === 'passed' ? '✓' : st === 'failed' || st === 'errored' ? '✕' : st === 'next' ? '→' : ''}</span>`;
      const chev = (open, has = true) => `<span class="chev ${has ? (open ? 'open' : '') : 'none'}"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M2 1l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>`;
      const state = () => document.body.dataset.state || 'running';

      // sel: null | {type:'task', taskId} | {type:'agent', kind, agentId, taskId} | {type:'change', suggestionId}
      let sel = null;
      let tab = null;
      const open = { run: true, tasks: true, personas: true, sugs: true };
      let replay = { cursor: 0, playing: true, timer: null };
      let after = false;
      let afterTimer = null;

      function agentTaskState(a, taskId) {
        const o = a.outcomes[taskId];
        if (o) return o;
        if (a.currentTaskId === taskId) return 'active';
        return M.historyOf(a.id, taskId).length ? 'pending' : 'disabled';
      }

      /* ---- chrome ---- */
      function renderChrome() {
        const done = M.tasks.filter((t) => M.taskStatus(t.id) === 'done').length;
        const pass = M.agents.reduce((n, a) => n + a.passed, 0);
        const fail = M.agents.reduce((n, a) => n + a.failed + a.errored, 0);
        $('#run-id').textContent = M.run.id.slice(0, 8);
        $('#run-started').textContent = M.run.startedAt;
        $('#run-state').textContent = state();
        $('#tb-counts').textContent = `${M.agents.length} personas · ${M.tasks.length} tasks`;
        $('#nav-count').textContent = `${done}/${M.tasks.length} done`;
        $('#sb-run').textContent = 'run ' + M.run.id.slice(0, 8);
        $('#sb-state').textContent = state();
        $('#sb-tasks').textContent = `tasks ${done}/${M.tasks.length}`;
        $('#sb-score').textContent = `✓ ${pass}  ✕ ${fail}`;
        $('#back').hidden = !sel;
        let s = 'No selection';
        if (sel && sel.type === 'task') s = 'task ' + sel.taskId;
        if (sel && sel.type === 'agent') s = `${sel.kind} · ${sel.agentId} / ${sel.taskId}`;
        if (sel && sel.type === 'change') s = 'suggestion ' + sel.suggestionId;
        $('#sb-sel').textContent = s;
      }

      /* ---- navigator ---- */
      function renderTree() {
        const completed = state() === 'completed';
        const done = M.tasks.filter((t) => M.taskStatus(t.id) === 'done').length;
        let h = `<li><button class="node group d0" data-tog="run">${chev(open.run)}<span class="ic" style="background:#374151">R</span><span class="label">Run <span class="mono muted">${M.run.id.slice(0, 8)}</span></span><span class="meta">${M.run.startedAt}</span></button></li>`;
        if (open.run) {
          h += `<li><button class="node group d1" data-tog="tasks">${chev(open.tasks)}<span></span><span class="label">Tasks</span><span class="meta">${done}/${M.tasks.length}</span></button></li>`;
          if (open.tasks) {
            h += M.tasks
              .map((t) => {
                const on = sel && ((sel.type === 'task' && sel.taskId === t.id));
                return `<li><button class="node d2 ${on ? 'sel' : ''}" data-task="${t.id}">${chev(false, false)}${ic(M.taskStatus(t.id))}<span class="label">${esc(t.short)}</span><span class="meta">${M.agents.filter((a) => a.outcomes[t.id]).length}/${M.agents.length}</span></button></li>`;
              })
              .join('');
            h += `<li class="only-evaluating node d2" style="cursor:default">${chev(false, false)}<span class="ic active"></span><span class="label muted">Evaluating…</span><span></span></li>`;
          }
          h += `<li><button class="node group d1" data-tog="personas">${chev(open.personas)}<span></span><span class="label">Personas</span><span class="meta">${M.agents.length}</span></button></li>`;
          if (open.personas) {
            h += M.agents
              .map((a) => {
                const p = M.personaOf(a);
                const isSel = sel && sel.type === 'agent' && sel.agentId === a.id;
                const t = M.taskById[a.currentTaskId];
                const sub = completed ? 'done' : a.status === 'error' ? 'error' : `<span class="spin"></span>${esc(t ? t.short : a.status)}`;
                let row = `<li><button class="node d2 ${isSel ? 'sel' : ''}" data-agent="${a.id}" title="${esc(p.long)}">${chev(isSel)}<span class="av">${esc(p.name[0])}${a.status === 'working' ? '<i class="live-dot"></i>' : ''}</span><span class="label">${esc(p.name)} <span class="muted" style="font-size:11px">${p.age} · ${sub}</span></span><span class="score"><span class="p">${a.passed}</span><span class="f">${a.failed + a.errored}</span></span></button></li>`;
                if (isSel)
                  row += M.tasks
                    .map((x) => {
                      const st = agentTaskState(a, x.id);
                      const has = M.historyOf(a.id, x.id).length > 0;
                      return `<li><button class="node d3 ${sel.taskId === x.id ? 'sel' : ''}" data-atask="${x.id}" data-agent-of="${a.id}" ${has ? '' : 'disabled'}>${chev(false, false)}${ic(st)}<span class="label">${esc(x.short)}</span><span class="meta">${has ? M.historyOf(a.id, x.id).length : ''}</span></button></li>`;
                    })
                    .join('');
                return row;
              })
              .join('');
          }
          h += `<li class="only-completed"><button class="node group d1" data-tog="sugs">${chev(open.sugs)}<span></span><span class="label">Suggestions</span><span class="meta">${M.suggestions.length}</span></button></li>`;
          if (open.sugs)
            h += `<li class="only-completed"><button class="node d2 cta ${sel && sel.type === 'change' ? 'sel' : ''}" data-open-change>${chev(false, false)}${ic('next')}<span class="label">See suggestions (${M.suggestions.length})</span><span></span></button></li>`;
        }
        const tree = $('#tree');
        tree.innerHTML = h;
        tree.querySelectorAll('[data-tog]').forEach((b) => b.addEventListener('click', () => { open[b.dataset.tog] = !open[b.dataset.tog]; renderTree(); }));
        tree.querySelectorAll('[data-task]').forEach((b) =>
          b.addEventListener('click', () => select(sel && sel.type === 'task' && sel.taskId === b.dataset.task ? null : { type: 'task', taskId: b.dataset.task })),
        );
        tree.querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => openAgent(b.dataset.agent, null)));
        tree.querySelectorAll('[data-atask]').forEach((b) => b.addEventListener('click', () => openAgentTask(b.dataset.agentOf, b.dataset.atask)));
        const c = tree.querySelector('[data-open-change]');
        if (c) c.addEventListener('click', () => select({ type: 'change', suggestionId: M.suggestions[0].id }));
      }

      /* ---- selection ---- */
      function openAgent(agentId, taskId) {
        const a = M.agentById[agentId];
        if (taskId && taskId in a.outcomes) return select({ type: 'agent', kind: 'replay', agentId, taskId });
        if (state() === 'running' && a.status === 'working' && (!taskId || taskId === a.currentTaskId))
          return select({ type: 'agent', kind: 'live', agentId, taskId: a.currentTaskId });
        const target = taskId || Object.keys(a.outcomes).pop() || a.currentTaskId;
        select({ type: 'agent', kind: 'replay', agentId, taskId: target });
      }
      function openAgentTask(agentId, taskId) {
        const a = M.agentById[agentId];
        const live = a.currentTaskId === taskId && !a.outcomes[taskId];
        select({ type: 'agent', kind: live ? 'live' : 'replay', agentId, taskId });
      }

      function select(next) {
        sel = next;
        after = false;
        clearTimeout(afterTimer);
        clearInterval(replay.timer);
        replay = { cursor: 0, playing: true, timer: null };
        tab = !sel ? null : sel.type === 'task' ? 'Task' : sel.type === 'agent' ? 'Step' : 'Suggestion';
        renderAll();
        if (sel && sel.type === 'agent' && sel.kind === 'replay') startReplay();
        if (sel && sel.type === 'change') {
          const id = sel.suggestionId;
          afterTimer = setTimeout(() => {
            if (sel && sel.type === 'change' && sel.suggestionId === id && !after) setAfter(true);
          }, 900);
        }
      }

      function renderAll() {
        renderChrome();
        renderTree();
        renderViewport();
        renderInspector();
      }

      /* ---- viewport ---- */
      function stepsFor() {
        return sel && sel.type === 'agent' ? M.historyOf(sel.agentId, sel.taskId) : [];
      }
      function shown() {
        return sel.kind === 'live' ? stepsFor().length : replay.cursor;
      }
      function screenFor(cursor, steps, t) {
        if (!steps.length) return 'home';
        if (cursor === 0) return t && t.id === 't-alarm' ? 'alarm' : 'home';
        const seen = steps.slice(0, cursor).map((s) => s.action);
        if (t && t.id === 't-basal' && seen.some((a) => a === 'press select')) return 'basal';
        if (seen.some((a) => a.startsWith('hold up') || a === 'press up')) return 'bolus';
        if (seen.some((a) => a === 'press select')) return 'home';
        return t && t.id === 't-alarm' ? 'alarm' : 'home';
      }

      function renderViewport() {
        const vp = $('#viewport');
        const stage = $('#stage');
        const dash = !sel || sel.type === 'task';
        vp.className = 'viewport' + (dash ? ' has-thumbs' + (sel ? '' : ' idle') : '');
        $('#hint').hidden = !!sel;
        $('#thumbs').hidden = !dash;
        $('#dock').hidden = !(sel && sel.type === 'agent' && sel.kind === 'replay');
        stage.dataset.screen = '';

        if (dash) {
          const t = sel && M.taskById[sel.taskId];
          $('#doc-tab').innerHTML = t ? `Viewport <span class="mono">${esc(t.id)} · overview</span>` : `Viewport <span class="mono">overview</span>`;
          $('#hud-l').textContent = t ? `${t.short} · ${M.taskStatus(t.id)}` : 'idle · 5 agents';
          stage.innerHTML = M.pumpSvg({ screen: t && t.id === 't-alarm' ? 'alarm' : t && t.id === 't-basal' ? 'basal' : 'home' });
          const completed = state() === 'completed';
          $('#thumbs').innerHTML = M.agents
            .map((a) => {
              const p = M.personaOf(a);
              const st = t ? agentTaskState(a, t.id) : null;
              const sub = t ? st : completed ? 'done' : `<span class="spin"></span>${esc(M.taskById[a.currentTaskId].short)}`;
              return `<button class="thumb" data-agent="${a.id}">${M.pumpSvg({ screen: a.currentTaskId === 't-alarm' ? 'alarm' : a.currentTaskId === 't-basal' ? 'basal' : 'bolus' }).replace(/pump-body/g, 'pb-' + a.id)}<span><span class="t-name">${esc(p.name)}</span><br><span class="t-sub">${sub}</span><br><span class="score"><span class="p">✓${a.passed}</span><span class="f">✕${a.failed + a.errored}</span></span></span></button>`;
            })
            .join('');
          $('#thumbs').querySelectorAll('[data-agent]').forEach((b) =>
            b.addEventListener('click', () => openAgent(b.dataset.agent, t ? t.id : null)),
          );
          return;
        }

        if (sel.type === 'change') {
          const s = M.suggestions.find((x) => x.id === sel.suggestionId);
          $('#doc-tab').innerHTML = `Viewport <span class="mono">${esc(s.id)} · ${after ? 'after' : 'before'}</span>`;
          $('#hud-l').textContent = `${s.change.type} · ${after ? 'after' : 'before'}`;
          stage.innerHTML = M.pumpSvg({ screen: 'bolus' });
          injectFx();
          applyAfter(s);
          return;
        }

        const a = M.agentById[sel.agentId];
        const t = M.taskById[sel.taskId];
        $('#doc-tab').innerHTML = `${esc(M.personaOf(a).name)} <span class="mono">${esc(a.id)} / ${esc(t.id)} · ${sel.kind}</span>`;
        if (sel.kind === 'replay') {
          const steps = stepsFor();
          $('#scrub').max = steps.length;
          $('#chips').innerHTML = steps.map((s, i) => `<li><button data-i="${i}"><b>${i + 1}</b>${esc(s.action)}</button></li>`).join('');
          $('#chips').querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => scrub(Number(b.dataset.i) + 1)));
          renderTransport();
        }
        syncStage();
      }

      function syncStage() {
        const steps = stepsFor();
        const n = shown();
        const cur = steps[n - 1];
        const t = M.taskById[sel.taskId];
        const pressed = cur && cur.action.match(/^(press|hold) (\w+)/);
        const stage = $('#stage');
        const want = screenFor(n, steps, t);
        if (stage.dataset.screen !== want) {
          stage.dataset.screen = want;
          stage.innerHTML = M.pumpSvg({ screen: want });
        }
        stage.querySelectorAll('[data-button]').forEach((k) => k.classList.toggle('pressed', !!pressed && k.dataset.button === pressed[2]));
        $('#hud-l').textContent = `${sel.kind === 'live' ? '● live' : 'replay'} · ${want} · ${pressed ? pressed[2] : '—'}`;
      }

      /* ---- inspector ---- */
      function tabsFor() {
        if (!sel) return ['Task', 'Persona', 'Step', 'Suggestion'];
        return ['Task', 'Persona', 'Step', 'Suggestion'];
      }
      function tabEnabled(name) {
        if (!sel) return false;
        if (sel.type === 'task') return name === 'Task';
        if (sel.type === 'agent') return name === 'Persona' || name === 'Step' || name === 'Task';
        return name === 'Suggestion';
      }
      function renderInspector() {
        $('#itabs').innerHTML = tabsFor()
          .map((n) => `<button class="itab ${tab === n ? 'on' : ''}" role="tab" aria-selected="${tab === n}" data-tab="${n}" ${tabEnabled(n) ? '' : 'disabled'}>${n}</button>`)
          .join('');
        $('#itabs').querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; renderInspector(); }));
        const box = $('#inspector');
        if (!sel) {
          box.innerHTML = `<p class="empty">Nothing selected.<br>Pick a task or persona in the navigator.</p>`;
          return;
        }
        if (tab === 'Task') return renderTaskTab(box, sel.taskId);
        if (tab === 'Persona') return renderPersonaTab(box);
        if (tab === 'Step') return renderStepTab(box);
        renderSuggestionTab(box);
      }

      function renderTaskTab(box, taskId) {
        const t = M.taskById[taskId];
        const i = M.tasks.indexOf(t);
        box.innerHTML = `
          <div class="sec">
            <div class="sec-h"><span>Task ${i + 1} of ${M.tasks.length}</span><span class="mono">${esc(t.id)}</span></div>
            <h2 class="ins-title">${esc(t.name)}</h2>
            <p class="quote">“${esc(t.description)}”</p>
          </div>
          <div class="sec">
            <dl class="props">
              <dt>Goal</dt><dd>${esc(t.goal)}</dd>
              <dt>Success</dt><dd><code class="codebox">${esc(t.success)}</code></dd>
              <dt>Max steps</dt><dd class="mono num">${t.maxSteps}</dd>
              <dt>Status</dt><dd>${ic(M.taskStatus(t.id))} <span style="vertical-align:2px">${M.taskStatus(t.id)}</span></dd>
            </dl>
          </div>
          <div class="sec">
            <div class="sec-h"><span>Outcomes</span><span class="num">${M.agents.filter((a) => a.outcomes[t.id]).length}/${M.agents.length} scored</span></div>
            ${M.agents
              .map((a) => {
                const st = agentTaskState(a, t.id);
                const n = M.historyOf(a.id, t.id).length;
                const can = st !== 'disabled' && st !== 'pending';
                return `<button class="list-row ${sel.type === 'agent' && sel.agentId === a.id ? 'sel' : ''}" data-agent="${a.id}" ${can ? '' : 'disabled'}>${ic(st)}<span>${esc(M.personaOf(a).name)} <span class="muted" style="font-size:11px">${st}</span></span><span class="meta num">${n ? n + ' steps' : '—'}</span></button>`;
              })
              .join('')}
          </div>`;
        box.querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => openAgent(b.dataset.agent, t.id)));
      }

      function failureSec(a) {
        const o = a.outcomes[sel.taskId];
        if (o !== 'failed' && o !== 'errored') return '';
        return `<div class="sec failure ${o}"><div class="sec-h"><span>${o === 'errored' ? 'Errored' : 'Failed'}</span><span class="mono">${esc(sel.taskId)}</span></div><p>${esc(a.reasons[sel.taskId] || 'No reason reported.')}</p></div>`;
      }

      function renderPersonaTab(box) {
        const a = M.agentById[sel.agentId];
        const p = M.personaOf(a);
        box.innerHTML = `
          <div class="sec">
            <div class="who"><span class="av lg">${esc(p.name[0])}</span><div><div class="name">${esc(p.name)}</div><div class="muted">${p.age} · ${esc(p.gender)}</div></div><span class="status">${esc(a.status)}</span></div>
            <p class="muted" style="margin-top:10px">${esc(p.blurb)}</p>
            <div class="mods">${p.modifiers.length ? p.modifiers.map((m) => `<span class="mod">${esc(m.label)}</span>`).join('') : '<span class="mod none">no modifiers</span>'}</div>
          </div>
          ${failureSec(a)}
          <div class="sec">
            <div class="sec-h"><span>Tasks</span><span class="score"><span class="p">✓ ${a.passed}</span><span class="f">✕ ${a.failed + a.errored}</span></span></div>
            ${M.tasks
              .map((x) => {
                const st = agentTaskState(a, x.id);
                const n = M.historyOf(a.id, x.id).length;
                return `<button class="list-row ${x.id === sel.taskId ? 'sel' : ''}" data-t="${x.id}" ${n ? '' : 'disabled'}>${ic(st)}<span>${esc(x.short)}</span><span class="meta num">${n || '—'}</span></button>`;
              })
              .join('')}
          </div>`;
        box.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => openAgentTask(a.id, b.dataset.t)));
      }

      function renderStepTab(box) {
        const a = M.agentById[sel.agentId];
        const p = M.personaOf(a);
        const steps = stepsFor();
        const n = shown();
        const cur = steps[n - 1];
        const t = M.taskById[sel.taskId];
        box.innerHTML = `
          <div class="sec" style="padding-bottom:10px">
            <div class="who"><span class="av">${esc(p.name[0])}</span><span style="font-weight:600">${esc(p.name)}</span><span class="muted">${p.age}, ${esc(p.gender)}</span><span class="status">${esc(a.status)}</span></div>
            ${p.modifiers.length ? `<div class="mods">${p.modifiers.map((m) => `<span class="mod">${esc(m.label)}</span>`).join('')}</div>` : ''}
          </div>
          <div class="sec" id="step-sec">
            <div class="sec-h"><span>${sel.kind === 'replay' ? `Step ${n} of ${steps.length}` : `Step ${n}`} · ${esc(t.short)}</span><span class="mono">${cur ? esc(cur.at) : ''}</span></div>
            <div class="action">${cur ? esc(cur.action) : 'waiting…'}</div>
            ${cur && cur.reasoning ? `<p class="reason">“${esc(cur.reasoning)}”</p>` : ''}
            ${sel.kind === 'live' ? `<figure class="frame">${M.frameSvg(p.id, { screen: screenFor(n, steps, t) })}<figcaption>heard confirmation beep (4 kHz, 80 ms)</figcaption></figure>` : ''}
          </div>
          ${failureSec(a)}`;
      }

      function renderSuggestionTab(box) {
        const s = M.suggestions.find((x) => x.id === sel.suggestionId);
        const params = Object.entries(s.change.params).map(([k, v]) => `${k}=${v}`).join(', ');
        box.innerHTML = `
          <div class="sec">
            <div class="sec-h"><span>Suggestions</span><span class="num">${M.suggestions.length}</span></div>
            ${M.suggestions
              .map((x) => `<button class="list-row sug-row ${x.id === s.id ? 'sel' : ''}" data-sug="${x.id}"><span><span class="tag ${x.category}">${x.category}</span></span><span class="label">${esc(x.title)}</span></button>`)
              .join('')}
          </div>
          <div class="sec">
            <span class="tag ${s.category}">${s.category}</span>
            <h2 class="ins-title" style="margin-top:8px">${esc(s.title)}</h2>
            <p class="muted" style="margin-top:6px">${esc(s.rationale)}</p>
            <div class="seg" role="group" aria-label="Compare"><button data-after="0" class="${after ? '' : 'on'}">Before</button><button data-after="1" class="${after ? 'on' : ''}">After</button></div>
            <code class="codebox">${esc(s.change.type)}(${esc(params)})</code>
          </div>
          <div class="sec">
            <div class="sec-h"><span>Evidence</span><span class="num">${s.evidence.length}</span></div>
            ${s.evidence
              .map((e) => `<button class="list-row" data-ev-agent="${e.agentId}" data-ev-task="${e.taskId}"><span class="av">${esc(M.personaOf(M.agentById[e.agentId]).name[0])}</span><span>${esc(M.personaOf(M.agentById[e.agentId]).name)} <span class="muted">· ${esc(M.taskById[e.taskId].short)}</span></span><span class="meta">§${e.step}</span></button>`)
              .join('')}
          </div>`;
        box.querySelectorAll('[data-sug]').forEach((b) => b.addEventListener('click', () => select({ type: 'change', suggestionId: b.dataset.sug })));
        box.querySelectorAll('[data-after]').forEach((b) => b.addEventListener('click', () => setAfter(b.dataset.after === '1')));
        box.querySelectorAll('[data-ev-agent]').forEach((b) =>
          b.addEventListener('click', () => select({ type: 'agent', kind: 'replay', agentId: b.dataset.evAgent, taskId: b.dataset.evTask })),
        );
      }

      /* ---- change mode fx ---- */
      function injectFx() {
        $('#stage svg').insertAdjacentHTML(
          'beforeend',
          `<g class="fx fx-dialog"><rect x="30" y="52" width="120" height="60" rx="4" fill="#0b1118" stroke="#9fb3c8"/><text x="90" y="74" text-anchor="middle" font-size="8" fill="#e8f0f8" font-family="system-ui">You delivered 0.5 U 20 s ago.</text><text x="90" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#ffb84d" font-family="system-ui">Deliver again?</text><text x="90" y="104" text-anchor="middle" font-size="7.5" fill="#9fb3c8" font-family="system-ui">BACK = no · SELECT = yes</text></g>` +
            `<g class="fx fx-timeout"><rect x="118" y="38" width="38" height="14" rx="3" fill="#2563eb"/><text x="137" y="48" text-anchor="middle" font-size="8" fill="#fff" font-family="system-ui">90 s</text></g>` +
            `<g class="fx fx-audio" fill="none" stroke="#2563eb" stroke-width="1.5"><circle cx="22" cy="22" r="9"/><circle cx="22" cy="22" r="15" opacity=".6"/><circle cx="22" cy="22" r="21" opacity=".3"/></g>`,
        );
      }
      function applyAfter(s) {
        $('#viewport').className = 'viewport' + (after ? ' after-' + s.change.type : '');
      }
      function setAfter(v) {
        after = v;
        const s = M.suggestions.find((x) => x.id === sel.suggestionId);
        applyAfter(s);
        $('#inspector').querySelectorAll('[data-after]').forEach((x) => x.classList.toggle('on', (x.dataset.after === '1') === after));
        $('#doc-tab').innerHTML = `Viewport <span class="mono">${esc(s.id)} · ${after ? 'after' : 'before'}</span>`;
        $('#hud-l').textContent = `${s.change.type} · ${after ? 'after' : 'before'}`;
      }

      /* ---- replay transport ---- */
      function refreshStep() {
        syncStage();
        if (tab === 'Step') renderInspector();
        renderTransport();
      }
      function startReplay() {
        clearInterval(replay.timer);
        replay.timer = setInterval(() => {
          if (!replay.playing || !sel || sel.kind !== 'replay') return;
          if (replay.cursor >= stepsFor().length) {
            replay.playing = false;
            renderTransport();
            return;
          }
          replay.cursor += 1;
          refreshStep();
        }, 1100);
      }
      function scrub(n) {
        replay.playing = false;
        replay.cursor = n;
        refreshStep();
      }
      function renderTransport() {
        const n = stepsFor().length;
        const ended = replay.cursor >= n;
        const playing = replay.playing && !ended;
        $('#scrub').value = replay.cursor;
        $('#pos').textContent = `${replay.cursor} / ${n}`;
        $('#play-icon').setAttribute('d', playing ? 'M5 3.5v9M11 3.5v9' : 'M5 3v10l8-5z');
        $('#play-icon').setAttribute('fill', playing ? 'none' : 'currentColor');
        $('#play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
        $('#chips').querySelectorAll('button').forEach((b, i) => {
          b.className = i < replay.cursor ? 'done' : i === replay.cursor ? 'next' : '';
          if (i === replay.cursor) b.scrollIntoView({ block: 'nearest', inline: 'center' });
        });
      }
      $('#play').addEventListener('click', () => {
        if (replay.cursor >= stepsFor().length) {
          replay.cursor = 0;
          replay.playing = true;
          refreshStep();
        } else {
          replay.playing = !replay.playing;
          renderTransport();
        }
      });
      $('#scrub').addEventListener('input', (e) => scrub(Number(e.target.value)));

      $('#back').addEventListener('click', () => select(null));
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sel) select(null);
      });

      /* ---- cosmetic orbit ---- */
      (function orbit() {
        const vp = $('#viewport');
        const stage = $('#stage');
        let drag = null;
        let rx = 8;
        let ry = -16;
        let z = 1;
        const apply = () => (stage.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${z})`);
        apply();
        vp.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.thumbs')) return;
          drag = { x: e.clientX, y: e.clientY, rx, ry };
          vp.classList.add('dragging');
          stage.style.transition = 'none';
        });
        window.addEventListener('pointermove', (e) => {
          if (!drag) return;
          ry = drag.ry + (e.clientX - drag.x) * 0.4;
          rx = Math.max(-40, Math.min(40, drag.rx - (e.clientY - drag.y) * 0.3));
          apply();
        });
        window.addEventListener('pointerup', () => {
          if (!drag) return;
          drag = null;
          vp.classList.remove('dragging');
          stage.style.transition = '';
        });
        vp.addEventListener('wheel', (e) => {
          if (e.target.closest('.thumbs')) return;
          e.preventDefault();
          z = Math.max(0.6, Math.min(1.6, z - e.deltaY * 0.001));
          apply();
        }, { passive: false });
      })();

      /* ---- mock controls ---- */
      document.addEventListener('mock:state', () => {
        renderChrome();
        renderTree();
        if (!sel || sel.type === 'task') renderViewport();
      });
      document.addEventListener('mock:open', (e) => {
        const k = e.detail.kind;
        if (k === 'dashboard') return select(null);
        if (k === 'change') return select({ type: 'change', suggestionId: M.defaults.change.suggestionId });
        select({ type: 'agent', kind: k, ...M.defaults[k] });
      });

      renderAll();
      M.mountControls();
    </script>
  </body>
</html>

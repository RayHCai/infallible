<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infallible · Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* 16 Deck: one idea per screen; the run is a slide deck paged with arrows and a dot rail. */
      :root {
        --bg: #f8f8f6;
        --ink: #17191c;
        --muted: #6b6f76;
        --faint: #a3a6ab;
        --rule: rgba(0, 0, 0, 0.1);
        --accent: #1f3f9a;
        --accent-soft: rgba(31, 63, 154, 0.07);
        --pass: #2f7d4f;
        --fail: #b3362f;
        --r: 6px;
        --sans: 'Manrope', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        --m: 64px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 400 14px/1.55 var(--sans);
        overflow: hidden;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
      button:disabled { cursor: default; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
      ul, ol { list-style: none; }
      code { font-family: var(--mono); font-size: 14px; }

      /* ---- slide frame ---- */
      .stagearea { position: fixed; inset: 0 0 48px 0; display: grid; place-items: center; padding: 16px 32px; }
      .slide {
        width: min(1280px, 100%, calc((100vh - 80px) * 1.6));
        height: min(100%, calc(min(1280px, 100vw - 64px) / 1.6));
        padding: 48px var(--m) 40px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 32px;
        min-height: 0;
      }
      .slide.enter { animation: fade 200ms var(--ease); }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .head { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 24px; }
      .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; display: flex; gap: 16px; flex-wrap: wrap; }
      .eyebrow b { font-weight: 600; color: var(--ink); }
      h1 { font-size: 32px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; margin-top: 8px; }
      h1 .sub { font-size: 20px; font-weight: 400; color: var(--muted); margin-left: 12px; }
      h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; display: flex; justify-content: space-between; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
      h2 .n { font-weight: 500; }
      .num { font-size: 12px; color: var(--muted); padding-top: 4px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
      .num::before { content: ''; width: 32px; height: 1px; background: var(--rule); }
      .sub-line { margin-top: 8px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 22px; }
      .link { color: var(--accent); font-weight: 600; border-radius: var(--r); }
      .link:hover { text-decoration: underline; text-underline-offset: 3px; }
      .body { min-height: 0; display: grid; gap: 64px; }
      .cols-2 { grid-template-columns: 1fr 1fr; }
      .scroll { overflow: auto; min-height: 0; scrollbar-width: thin; }
      .col { min-height: 0; display: flex; flex-direction: column; gap: 32px; }
      .muted { color: var(--muted); }

      /* ---- rows: glyph · title · meta ---- */
      .rows li + li .row { border-top: 1px solid var(--rule); }
      .row {
        width: 100%; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px;
        padding: 12px 8px; min-height: 48px; transition: background 150ms;
      }
      .row:not(:disabled):hover { background: var(--accent-soft); }
      .row.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
      .row:disabled { color: var(--faint); }
      .row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .title small { font-size: 12px; color: var(--muted); margin-left: 8px; }
      .row:disabled .title small { color: var(--faint); }
      .row .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 16px; justify-content: flex-end; white-space: nowrap; }
      .row .meta .fig { min-width: 48px; text-align: right; }
      .rows.compact .row { padding: 8px; min-height: 40px; }
      .g { width: 16px; height: 16px; display: block; }
      .g-passed { color: var(--pass); } .g-failed, .g-errored { color: var(--fail); }
      .g-active { color: var(--accent); } .g-done { color: var(--ink); } .g-pending, .g-disabled { color: var(--faint); }
      .av { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--accent); background: #fff; }
      .av.lg { width: 40px; height: 40px; font-size: 14px; }
      .spin { width: 12px; height: 12px; border: 1.5px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; display: inline-block; flex: none; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---- task slide ---- */
      .brief { font-size: 20px; line-height: 1.45; border-left: 2px solid var(--accent); padding-left: 24px; quotes: '“' '”'; }
      .brief::before { content: open-quote; } .brief::after { content: close-quote; }
      dl.facts { display: grid; grid-template-columns: 112px 1fr; row-gap: 16px; column-gap: 24px; }
      dl.facts dt { font-size: 12px; color: var(--muted); padding-top: 2px; }
      dl.facts dd code { background: #fff; border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 12px; display: block; word-break: break-word; }

      /* ---- persona slide ---- */
      .p-body { grid-template-columns: 55fr 45fr; gap: 48px; }
      .vp-col { display: grid; grid-template-rows: 1fr auto; gap: 16px; min-height: 0; min-width: 0; }
      .viewport { position: relative; background: #f0f0ed; border-radius: var(--r); overflow: hidden; cursor: grab; display: grid; place-items: center; min-height: 0; touch-action: none; }
      .viewport.dragging { cursor: grabbing; }
      .viewport::after { content: ''; position: absolute; left: 50%; bottom: 6%; width: 34%; height: 18px; transform: translateX(-50%); border-radius: 50%; background: rgba(0, 0, 0, 0.06); box-shadow: 0 0 16px 8px rgba(0, 0, 0, 0.06); pointer-events: none; }
      .stage { height: 80%; aspect-ratio: 180 / 320; transition: transform 300ms var(--ease); position: relative; z-index: 1; }
      .stage svg { width: 100%; height: 100%; display: block; }
      .stage .key, .stage .screen text, .stage .fx { transition: transform 0.7s var(--ease), opacity 0.5s var(--ease); transform-box: fill-box; transform-origin: center; }
      .stage .fx { opacity: 0; }
      .stage .key rect { transition: fill 150ms; }
      .stage .key.pressed rect { fill: #4a68c4; }
      .viewport.after-move_button .key-select { transform: translateY(16px); }
      .viewport.after-resize_text .screen text { transform: scale(1.5); }
      .viewport.after-confirm_dialog .fx-dialog, .viewport.after-change_timeout .fx-timeout, .viewport.after-add_audio_cue .fx-audio { opacity: 1; }
      .vp-cap { position: absolute; left: 16px; top: 16px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; z-index: 2; pointer-events: none; }
      .tag { font-size: 12px; font-weight: 600; color: var(--accent); }
      .transport { display: grid; grid-template-columns: 32px 144px minmax(0, 1fr); gap: 16px; align-items: center; height: 40px; }
      .transport.live { display: flex; color: var(--muted); font-size: 12px; gap: 8px; }
      .ibtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; background: #fff; transition: border-color 150ms, color 150ms; }
      .ibtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .ibtn:disabled { opacity: 0.35; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      .chips-steps { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
      .chips-steps::-webkit-scrollbar { display: none; }
      .chips-steps button { flex: none; font-size: 12px; padding: 4px 8px; border-radius: var(--r); color: var(--faint); border: 1px solid transparent; white-space: nowrap; transition: color 150ms, border-color 150ms; }
      .chips-steps button sup { font-size: 11px; margin-right: 4px; vertical-align: 0; }
      .chips-steps button.done { color: var(--muted); }
      .chips-steps button.next { color: var(--accent); border-color: var(--accent); }
      .chips-steps button:hover { color: var(--ink); }
      .side { display: flex; flex-direction: column; gap: 32px; padding-right: 8px; }
      .who { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
      .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: center; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
      .chip { font-size: 12px; border: 1px solid var(--rule); border-radius: var(--r); padding: 2px 8px; background: #fff; }
      .action { font-size: 20px; font-weight: 600; margin: 8px 0; animation: fade 200ms var(--ease); }
      q.reason { display: block; color: var(--muted); quotes: '“' '”'; }
      .frame { margin-top: 16px; }
      .frame svg { width: 100%; max-height: 120px; display: block; border-radius: var(--r); }
      .frame figcaption { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; }
      .failure { border-left: 2px solid var(--fail); padding-left: 16px; }
      .failure .k { font-size: 12px; font-weight: 600; color: var(--fail); }

      /* ---- changes slide ---- */
      .c-body { grid-template-columns: 5fr 7fr; gap: 64px; }
      .c-right { display: grid; grid-template-rows: auto 1fr; gap: 32px; min-height: 0; }
      .c-low { display: grid; grid-template-columns: 1fr 224px; gap: 32px; min-height: 0; }
      .c-low .viewport { min-height: 200px; }
      .cat { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
      .cat::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .cat.hardware { color: #8a5a1c; } .cat.firmware { color: var(--accent); } .cat.interaction { color: #6b3d8f; }
      .card-title { font-size: 20px; font-weight: 600; margin: 8px 0; }
      .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); padding: 2px; margin: 16px 16px 0 0; background: #fff; vertical-align: middle; }
      .seg button { padding: 4px 16px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--muted); transition: background 150ms, color 150ms; }
      .seg button.on { background: var(--accent); color: #fff; }
      .change-code { display: inline-block; margin-top: 16px; vertical-align: middle; color: var(--muted); }

      /* ---- rail ---- */
      .rail { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; border-top: 1px solid var(--rule); background: var(--bg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 32px; z-index: 5; }
      .rail .back { font-size: 12px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: var(--r); justify-self: start; }
      .rail .back:hover { color: var(--accent); }
      .dots { display: flex; align-items: center; gap: 24px; }
      .grp { display: flex; align-items: center; gap: 4px; }
      .grp > span { font-size: 11px; color: var(--muted); margin-right: 4px; }
      .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
      .dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background 150ms, transform 150ms; }
      .dot:hover::after { background: var(--ink); }
      .dot.on::after { background: var(--accent); transform: scale(1.5); }
      .nav { justify-self: end; display: flex; gap: 8px; align-items: center; }
      .nav .ibtn { width: 28px; height: 28px; }
      .count { font-size: 12px; color: var(--muted); margin-right: 8px; }

      @media (max-width: 1240px) { :root { --m: 40px; } .body, .c-body { gap: 40px; } .p-body { gap: 32px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body data-state="running">
    <main class="stagearea"><div class="slide" id="slide"></div></main>
    <nav class="rail" aria-label="Slides">
      <button class="back" id="back" title="Back to run (Esc)"><svg class="g" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3 5 8l5 5" /></svg>Back to run</button>
      <div class="dots" id="dots"></div>
      <div class="nav">
        <span class="count" id="count"></span>
        <button class="ibtn" id="prev" aria-label="Previous slide"><svg class="g" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3 5 8l5 5" /></svg></button>
        <button class="ibtn" id="next" aria-label="Next slide"><svg class="g" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 3 5 5-5 5" /></svg></button>
      </div>
    </nav>
    <script src="_shared/mock.js"></script>
    <script>
      const M = window.MOCK;
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const state = () => document.body.dataset.state;
      const running = () => state() === 'running';

      // Slide indices: 0 run, 1-5 tasks, 6-10 personas, 11 changes.
      let cur = 0;
      const view = {}; // agentId -> { kind: 'live' | 'replay', taskId }
      let sugId = M.suggestions[0].id;
      let after = false;
      let afterTimer = null;
      let replay = { cursor: 0, playing: false, timer: null };
      const orbit = { rx: -6, ry: 14, z: 1 };
      const isPersona = () => cur >= 6 && cur <= 10;
      const total = () => (state() === 'completed' || cur === 11 ? 12 : 11);

      const G = {
        passed: '<circle cx="8" cy="8" r="6.25"/><path d="m5.3 8.2 1.9 1.9 3.6-3.8"/>',
        done: '<circle cx="8" cy="8" r="6.25"/><path d="m5.3 8.2 1.9 1.9 3.6-3.8"/>',
        failed: '<circle cx="8" cy="8" r="6.25"/><path d="m5.8 5.8 4.4 4.4m0-4.4-4.4 4.4"/>',
        errored: '<path d="M8 1.8 14.5 13.5h-13z"/><path d="M8 6.3v3.2m0 1.9v.1"/>',
        active: '<circle cx="8" cy="8" r="6.25"/><circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/>',
        pending: '<circle cx="8" cy="8" r="6.25" stroke-dasharray="2 2.2"/>',
        disabled: '<circle cx="8" cy="8" r="6.25" stroke-dasharray="1 3"/>',
      };
      const glyph = (st) =>
        `<svg class="g g-${st}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" role="img" aria-label="${st}">${G[st] || G.pending}</svg>`;

      function outcomeOf(a, taskId) {
        if (a.outcomes[taskId]) return a.outcomes[taskId];
        if (a.currentTaskId === taskId) return 'active';
        return M.historyOf(a.id, taskId).length ? 'pending' : 'disabled';
      }
      const lastScored = (a) => Object.keys(a.outcomes).pop() || a.currentTaskId;
      function defaultView(a) {
        if (running() && a.status === 'working') return { kind: 'live', taskId: a.currentTaskId };
        return { kind: 'replay', taskId: lastScored(a) };
      }
      const scoredCount = () => M.agents.reduce((n, a) => n + Object.keys(a.outcomes).length, 0);

      /* ---- navigation ---- */
      function go(i, opts) {
        i = Math.max(0, Math.min(total() - 1, i));
        if (i >= 6 && i <= 10) {
          const a = M.agents[i - 6];
          if (opts) view[a.id] = opts;
          else if (!view[a.id] || cur !== i) view[a.id] = defaultView(a);
        }
        clearInterval(replay.timer);
        clearTimeout(afterTimer);
        replay = { cursor: 0, playing: false, timer: null };
        after = false;
        cur = i;
        render(true);
      }
      function openAgent(agentId, taskId) {
        const a = M.agentById[agentId];
        const i = 6 + M.agents.indexOf(a);
        if (taskId && taskId in a.outcomes) return go(i, { kind: 'replay', taskId });
        if (running() && a.status === 'working' && (!taskId || taskId === a.currentTaskId)) return go(i, { kind: 'live', taskId: a.currentTaskId });
        go(i, { kind: 'replay', taskId: taskId || lastScored(a) });
      }

      function render(animate) {
        const el = $('#slide');
        el.className = 'slide';
        if (cur === 0) el.innerHTML = runSlide();
        else if (cur <= 5) el.innerHTML = taskSlide(M.tasks[cur - 1]);
        else if (cur <= 10) el.innerHTML = personaSlide(M.agents[cur - 6]);
        else el.innerHTML = changeSlide();
        if (animate) {
          void el.offsetWidth;
          el.classList.add('enter');
        }
        bind(el);
        renderRail();
      }

      function head(eyebrow, title, extra) {
        return `<header class="head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${extra || ''}</div><div class="num">${cur + 1} / ${total()}</div></header>`;
      }

      /* ---- slide 1: run ---- */
      function runSlide() {
        const st = state();
        const done = M.tasks.filter((t) => M.taskStatus(t.id) === 'done').length;
        const line =
          st === 'evaluating'
            ? `<p class="sub-line"><span class="spin"></span>Evaluating outcomes against each task’s success predicate</p>`
            : st === 'completed'
              ? `<p class="sub-line">All attempts scored. <button class="link" data-go="11">See suggestions (${M.suggestions.length}) →</button></p>`
              : `<p class="sub-line">${scoredCount()} of ${M.agents.length * M.tasks.length} attempts scored</p>`;
        const tasks = M.tasks
          .map((t, i) => {
            const n = M.agents.filter((a) => t.id in a.outcomes).length;
            return `<li><button class="row" data-go="${i + 1}">${glyph(M.taskStatus(t.id))}<span class="title">${esc(t.short)}</span><span class="meta"><span>${M.taskStatus(t.id)}</span><span class="fig">${n} of ${M.agents.length}</span></span></button></li>`;
          })
          .join('');
        const people = M.agents
          .map((a) => {
            const p = M.personaOf(a);
            const now = a.status === 'error' ? 'error' : st === 'completed' ? 'done' : M.taskById[a.currentTaskId].short;
            const spin = running() && a.status === 'working' ? '<span class="spin" aria-label="working"></span>' : '';
            return `<li><button class="row" data-agent="${a.id}"><span class="av">${esc(p.name[0])}</span><span class="title">${esc(p.name)}<small>${p.age}</small></span><span class="meta">${spin}<span>${esc(now)}</span><span class="fig">${a.passed} / ${a.failed + a.errored}</span></span></button></li>`;
          })
          .join('');
        return (
          head(
            `<span><b>Infallible</b></span><span>Started ${esc(M.run.startedAt)}</span><span>${M.agents.length} personas</span><span>${M.tasks.length} tasks</span>`,
            `Run ${esc(M.run.id.slice(0, 8))} · ${esc(st)}`,
            line,
          ) +
          `<div class="body cols-2"><section class="col scroll"><div><h2>Tasks<span class="n">${done} of ${M.tasks.length} done · scored</span></h2><ul class="rows">${tasks}</ul></div></section>` +
          `<section class="col scroll"><div><h2>Personas<span class="n">now · pass / fail</span></h2><ul class="rows">${people}</ul></div></section></div>`
        );
      }

      /* ---- slides 2-6: tasks ---- */
      function taskSlide(t) {
        const rows = M.agents
          .map((a) => {
            const p = M.personaOf(a);
            const st = outcomeOf(a, t.id);
            const n = M.historyOf(a.id, t.id).length;
            const can = st !== 'disabled' && st !== 'pending';
            const label = st === 'active' ? (running() ? 'live' : 'in progress') : st === 'disabled' ? 'not started' : st;
            return `<li><button class="row" data-agent="${a.id}" data-task="${t.id}" ${can ? '' : 'disabled'}>${glyph(st)}<span class="title">${esc(p.name)}<small>${p.age}</small></span><span class="meta"><span>${esc(label)}</span><span class="fig">${n} steps</span></span></button></li>`;
          })
          .join('');
        return (
          head(`<span>Task ${cur} of ${M.tasks.length}</span><span>${esc(M.taskStatus(t.id))}</span>`, esc(t.name)) +
          `<div class="body cols-2"><section class="col scroll"><blockquote class="brief">${esc(t.description)}</blockquote>
            <dl class="facts"><dt>Goal</dt><dd>${esc(t.goal)}</dd><dt>Success when</dt><dd><code>${esc(t.success)}</code></dd><dt>Max steps</dt><dd>${t.maxSteps}</dd></dl></section>
           <section class="col scroll"><div><h2>Attempts<span class="n">${M.agents.filter((a) => t.id in a.outcomes).length} of ${M.agents.length} scored</span></h2><ul class="rows">${rows}</ul></div></section></div>`
        );
      }

      /* ---- slides 7-11: persona sandbox ---- */
      function stepsNow() {
        if (!isPersona()) return [];
        const a = M.agents[cur - 6];
        return M.historyOf(a.id, view[a.id].taskId);
      }
      function personaSlide(a) {
        const p = M.personaOf(a);
        const v = view[a.id];
        const t = M.taskById[v.taskId];
        const o = a.outcomes[v.taskId];
        const steps = stepsNow();
        const working = running() && a.status === 'working';
        const tasks = M.tasks
          .map((x) => {
            const st = outcomeOf(a, x.id);
            const n = M.historyOf(a.id, x.id).length;
            const live = st === 'active' && running();
            return `<li><button class="row ${x.id === v.taskId ? 'on' : ''}" data-ptask="${x.id}" data-live="${live ? 1 : 0}" ${n ? '' : 'disabled'}>${glyph(st)}<span class="title">${esc(x.short)}</span><span class="meta"><span>${live ? 'live' : ''}</span><span class="fig">${n || '–'}</span></span></button></li>`;
          })
          .join('');
        const transport =
          v.kind === 'replay'
            ? `<div class="transport"><button class="ibtn" id="play" aria-label="Play or pause"><svg class="g" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5"><path id="play-icon" d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg></button>
               <input type="range" id="scrub" min="0" max="${steps.length}" value="0" aria-label="Scrub steps" />
               <ol class="chips-steps" id="chips">${steps.map((s, i) => `<li><button data-i="${i}"><sup>${i + 1}</sup>${esc(s.action)}</button></li>`).join('')}</ol></div>`
            : `<div class="transport live">${running() ? '<span class="spin"></span>' : ''}<span>Following live · step ${steps.length} of at most ${t.maxSteps}</span></div>`;
        return (
          head(`<span>Persona ${cur - 5} of ${M.agents.length}</span><span>${esc(p.long)}</span>`, `${esc(p.name)}<span class="sub">${p.age}, ${esc(p.gender)}</span>`) +
          `<div class="body p-body">
            <section class="vp-col"><div class="viewport" id="viewport"><div class="vp-cap"><span class="tag">${v.kind === 'live' ? 'Live' : 'Replay'}</span><span>${esc(t.short)} · drag to orbit, scroll to zoom</span></div><div class="stage" id="stage"></div></div>${transport}</section>
            <aside class="side scroll">
              <div><div class="who"><span class="av lg">${esc(p.name[0])}</span><div><div style="font-weight:600">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.blurb)}</div></div><span class="pill">${working ? '<span class="spin"></span>' : ''}${esc(a.status)}</span></div>
                <div class="chips">${p.modifiers.length ? p.modifiers.map((m) => `<span class="chip">${esc(m.label)}</span>`).join('') : '<span class="muted" style="font-size:12px">No perception modifiers</span>'}</div></div>
              <section id="step"></section>
              ${o === 'failed' || o === 'errored' ? `<section class="failure"><div class="k">${o === 'errored' ? 'Errored' : 'Failed'}</div><p>${esc(a.reasons[v.taskId] || 'No reason reported.')}</p></section>` : ''}
              <section><h2>Tasks<span class="n">${Object.keys(a.outcomes).length} of ${M.tasks.length} scored · steps</span></h2><ul class="rows compact">${tasks}</ul></section>
            </aside></div>`
        );
      }

      function screenFor(cursor, steps, t) {
        if (!steps.length) return 'home';
        if (cursor === 0) return t && t.id === 't-alarm' ? 'alarm' : 'home';
        const seen = steps.slice(0, cursor).map((s) => s.action);
        if (t && t.id === 't-basal' && seen.some((x) => x === 'press select')) return 'basal';
        if (seen.some((x) => x.startsWith('hold up') || x === 'press up')) return 'bolus';
        if (seen.some((x) => x === 'press select')) return 'home';
        return t && t.id === 't-alarm' ? 'alarm' : 'home';
      }

      function renderStep() {
        const a = M.agents[cur - 6];
        const v = view[a.id];
        const t = M.taskById[v.taskId];
        const steps = stepsNow();
        const shown = v.kind === 'live' ? steps.length : replay.cursor;
        const c = steps[shown - 1];
        const scr = screenFor(shown, steps, t);
        $('#step').innerHTML =
          `<h2>${v.kind === 'replay' ? `Step ${shown} of ${steps.length}` : `Step ${shown}`}<span class="n">${esc(t.short)}${c ? ' · ' + esc(c.at) : ''}</span></h2>` +
          `<div class="action">${c ? esc(c.action) : 'Waiting for first action'}</div>` +
          (c && c.reasoning ? `<q class="reason">${esc(c.reasoning)}</q>` : '') +
          (v.kind === 'live'
            ? `<figure class="frame">${M.frameSvg(a.personaId, { screen: scr })}<figcaption><span class="tag">Agent view</span>heard confirmation beep (4 kHz, 80 ms)</figcaption></figure>`
            : '');
        const pressed = c && c.action.match(/^(press|hold) (\w+)/);
        const stage = $('#stage');
        if (stage.dataset.screen !== scr) {
          stage.dataset.screen = scr;
          stage.innerHTML = M.pumpSvg({ screen: scr });
        }
        $$('.key', stage).forEach((k) => k.classList.toggle('pressed', !!pressed && k.dataset.button === pressed[2]));
        applyOrbit();
      }

      function startReplay() {
        clearInterval(replay.timer);
        replay.playing = true;
        replay.timer = setInterval(() => {
          if (!replay.playing) return;
          if (replay.cursor >= stepsNow().length) {
            replay.playing = false;
            return renderTransport();
          }
          replay.cursor += 1;
          renderStep();
          renderTransport();
        }, 1100);
        renderTransport();
      }
      function scrub(n) {
        replay.playing = false;
        replay.cursor = n;
        renderStep();
        renderTransport();
      }
      function renderTransport() {
        if (!$('#scrub')) return;
        const n = stepsNow().length;
        const playing = replay.playing && replay.cursor < n;
        $('#scrub').value = replay.cursor;
        $('#play-icon').setAttribute('d', playing ? 'M5 3.5v9M11 3.5v9' : 'M5 3.5v9l7-4.5z');
        $('#play-icon').setAttribute('fill', playing ? 'none' : 'currentColor');
        const box = $('#chips');
        $$('button', box).forEach((b, i) => {
          b.className = i < replay.cursor ? 'done' : i === replay.cursor ? 'next' : '';
          if (i === Math.min(replay.cursor, n - 1)) box.scrollLeft = b.offsetLeft - box.offsetLeft - box.clientWidth / 2 + b.offsetWidth / 2;
        });
      }

      /* ---- slide 12: changes ---- */
      function changeSlide() {
        const s = M.suggestions.find((x) => x.id === sugId);
        const list = M.suggestions
          .map(
            (x, i) =>
              `<li><button class="row ${x.id === s.id ? 'on' : ''}" data-sug="${x.id}"><span class="muted" style="font-size:12px">${i + 1}</span><span class="title">${esc(x.title)}</span><span class="meta"><span class="cat ${x.category}">${x.category}</span></span></button></li>`,
          )
          .join('');
        const ev = s.evidence
          .map((e) => {
            const a = M.agentById[e.agentId];
            return `<li><button class="row" data-ev-agent="${e.agentId}" data-ev-task="${e.taskId}">${glyph(a.outcomes[e.taskId] || 'active')}<span class="title">${esc(M.personaOf(a).name)}</span><span class="meta"><span>${esc(M.taskById[e.taskId].short)}</span><span class="fig">§${e.step}</span></span></button></li>`;
          })
          .join('');
        const params = Object.entries(s.change.params)
          .map(([k, v]) => `${k}=${v}`)
          .join(', ');
        return (
          head(`<span>From run ${esc(M.run.id.slice(0, 8))}</span><span>${M.agents.length} personas · ${M.tasks.length} tasks</span>`, `${M.suggestions.length} proposed changes`) +
          `<div class="body c-body"><section class="col scroll"><div><h2>Suggestions<span class="n">category</span></h2><ul class="rows">${list}</ul></div></section>
            <section class="c-right"><div><span class="cat ${s.category}">${s.category}</span><div class="card-title">${esc(s.title)}</div><p class="muted">${esc(s.rationale)}</p>
              <div class="seg" role="group" aria-label="Compare"><button data-after="0" class="on">Before</button><button data-after="1">After</button></div><code class="change-code">${esc(s.change.type)}(${esc(params)})</code></div>
              <div class="c-low"><div class="scroll"><h2>Evidence<span class="n">step</span></h2><ul class="rows compact">${ev}</ul></div>
                <div class="viewport" id="viewport"><div class="vp-cap"><span class="tag" id="ba">Before</span></div><div class="stage" id="stage"></div></div></div></section></div>`
        );
      }
      function injectFx() {
        $('#stage svg').insertAdjacentHTML(
          'beforeend',
          `<g class="fx fx-dialog"><rect x="30" y="52" width="120" height="60" rx="4" fill="#0b1118" stroke="#9fb3c8"/><text x="90" y="74" text-anchor="middle" font-size="8" fill="#e8f0f8" font-family="system-ui">You delivered 0.5 U 20 s ago.</text><text x="90" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#ffb84d" font-family="system-ui">Deliver again?</text><text x="90" y="104" text-anchor="middle" font-size="7.5" fill="#9fb3c8" font-family="system-ui">BACK = no · SELECT = yes</text></g>` +
            `<g class="fx fx-timeout"><rect x="118" y="38" width="38" height="14" rx="3" fill="#1b1a17"/><text x="137" y="48" text-anchor="middle" font-size="8" fill="#f4f1ea" font-family="system-ui">90 s</text></g>` +
            `<g class="fx fx-audio" fill="none" stroke="#ffb84d" stroke-width="1.5"><circle cx="22" cy="22" r="9"/><circle cx="22" cy="22" r="15" opacity=".6"/><circle cx="22" cy="22" r="21" opacity=".3"/></g>`,
        );
      }
      function setAfter(v) {
        after = v;
        const s = M.suggestions.find((x) => x.id === sugId);
        $$('[data-after]').forEach((b) => b.classList.toggle('on', (b.dataset.after === '1') === after));
        $('#viewport').className = 'viewport' + (after ? ' after-' + s.change.type : '');
        $('#ba').textContent = after ? 'After' : 'Before';
      }

      /* ---- binding ---- */
      function bind(el) {
        $$('[data-go]', el).forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.go))));
        $$('[data-agent]', el).forEach((b) => b.addEventListener('click', () => openAgent(b.dataset.agent, b.dataset.task || null)));
        if (isPersona()) {
          const a = M.agents[cur - 6];
          $$('[data-ptask]', el).forEach((b) =>
            b.addEventListener('click', () => go(cur, { kind: b.dataset.live === '1' ? 'live' : 'replay', taskId: b.dataset.ptask })),
          );
          renderStep();
          if (view[a.id].kind === 'replay') {
            $('#play').addEventListener('click', () => {
              if (replay.cursor >= stepsNow().length) {
                replay.cursor = 0;
                renderStep();
                startReplay();
              } else if (!replay.timer) startReplay();
              else {
                replay.playing = !replay.playing;
                renderTransport();
              }
            });
            $('#scrub').addEventListener('input', (e) => scrub(Number(e.target.value)));
            $$('#chips [data-i]').forEach((b) => b.addEventListener('click', () => scrub(Number(b.dataset.i) + 1)));
            startReplay();
          }
        }
        if (cur === 11) {
          $('#stage').innerHTML = M.pumpSvg({ screen: 'bolus' });
          injectFx();
          applyOrbit();
          $$('[data-sug]', el).forEach((b) =>
            b.addEventListener('click', () => {
              sugId = b.dataset.sug;
              go(11);
            }),
          );
          $$('[data-after]', el).forEach((b) =>
            b.addEventListener('click', () => {
              clearTimeout(afterTimer);
              setAfter(b.dataset.after === '1');
            }),
          );
          $$('[data-ev-agent]', el).forEach((b) =>
            b.addEventListener('click', () => go(6 + M.agents.indexOf(M.agentById[b.dataset.evAgent]), { kind: 'replay', taskId: b.dataset.evTask })),
          );
          afterTimer = setTimeout(() => cur === 11 && !after && setAfter(true), 900);
        }
      }

      function renderRail() {
        const n = total();
        const dot = (i, label) =>
          `<button class="dot ${i === cur ? 'on' : ''}" data-dot="${i}" title="${esc(label)}" aria-label="${esc(label)}" ${i === cur ? 'aria-current="true"' : ''}></button>`;
        $('#dots').innerHTML =
          `<div class="grp"><span>Run</span>${dot(0, 'Run overview')}</div>` +
          `<div class="grp"><span>Tasks</span>${M.tasks.map((t, i) => dot(i + 1, t.short)).join('')}</div>` +
          `<div class="grp"><span>Personas</span>${M.agents.map((a, i) => dot(i + 6, M.personaOf(a).name)).join('')}</div>` +
          (n === 12 ? `<div class="grp"><span>Changes</span>${dot(11, 'Proposed changes')}</div>` : '');
        $$('[data-dot]').forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.dot))));
        $('#count').textContent = `${cur + 1} / ${n}`;
        $('#prev').disabled = cur === 0;
        $('#next').disabled = cur >= n - 1;
        $('#back').style.visibility = cur === 0 ? 'hidden' : 'visible';
      }
      $('#prev').addEventListener('click', () => go(cur - 1));
      $('#next').addEventListener('click', () => go(cur + 1));
      $('#back').addEventListener('click', () => go(0));
      window.addEventListener('keydown', (e) => {
        if (e.target.matches && e.target.matches('input, select, textarea')) return;
        if (e.key === 'ArrowRight') go(cur + 1);
        else if (e.key === 'ArrowLeft') go(cur - 1);
        else if (e.key === 'Escape' && cur !== 0) go(0);
      });

      /* ---- cosmetic orbit ---- */
      function applyOrbit() {
        const s = $('#stage');
        if (s) s.style.transform = `perspective(1100px) rotateX(${orbit.rx}deg) rotateY(${orbit.ry}deg) scale(${orbit.z})`;
      }
      let drag = null;
      document.addEventListener('pointerdown', (e) => {
        const vp = e.target.closest && e.target.closest('.viewport');
        if (!vp) return;
        drag = { x: e.clientX, y: e.clientY, rx: orbit.rx, ry: orbit.ry, vp };
        vp.classList.add('dragging');
        $('#stage').style.transition = 'none';
      });
      window.addEventListener('pointermove', (e) => {
        if (!drag) return;
        orbit.ry = drag.ry + (e.clientX - drag.x) * 0.4;
        orbit.rx = Math.max(-40, Math.min(40, drag.rx - (e.clientY - drag.y) * 0.3));
        applyOrbit();
      });
      window.addEventListener('pointerup', () => {
        if (!drag) return;
        drag.vp.classList.remove('dragging');
        const s = $('#stage');
        if (s) s.style.transition = '';
        drag = null;
      });
      document.addEventListener(
        'wheel',
        (e) => {
          if (!(e.target.closest && e.target.closest('.viewport'))) return;
          e.preventDefault();
          orbit.z = Math.max(0.6, Math.min(1.6, orbit.z - e.deltaY * 0.001));
          applyOrbit();
        },
        { passive: false },
      );

      /* ---- mock hooks ---- */
      document.addEventListener('mock:state', () => {
        if (cur === 11 && state() !== 'completed') return go(0);
        render(false);
      });
      document.addEventListener('mock:open', (e) => {
        const k = e.detail.kind;
        if (k === 'dashboard') return go(0);
        if (k === 'change') {
          sugId = M.defaults.change.suggestionId;
          cur = 11;
          return go(11);
        }
        const d = M.defaults[k];
        go(6 + M.agents.indexOf(M.agentById[d.agentId]), { kind: k, taskId: d.taskId });
      });

      render(false);
      M.mountControls();
    </script>
  </body>
</html>

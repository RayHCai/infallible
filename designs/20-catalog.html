<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog · Infallible design 20</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* 20 · Catalog — a strict uniform card grid; selecting a card expands one full-width detail panel under its row. */
      :root {
        --page: #f7f7f5;
        --panel: #fff;
        --ink: #1a1c1e;
        --ink-2: #5f6368;
        --ink-3: #9aa0a6;
        --line: rgba(0, 0, 0, 0.1);
        --hover: #f1f2f0;
        --accent: #1f5f6b;
        --accent-soft: #e8f0f1;
        --green: #2e7d4f;
        --red: #b3402f;
        --amber: #a8701a;
        --violet: #6a4fb0;
        --r: 10px;
        --sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 14px/1.5 var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }
      ul, ol { padding: 0; list-style: none; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
      button:disabled { cursor: default; opacity: 0.45; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      code { font-family: var(--mono); font-size: 12px; }
      .eyebrow { font-size: 12px; font-weight: 500; color: var(--ink-2); }
      .dim { color: var(--ink-2); }
      .faint { color: var(--ink-3); }
      .num { text-align: right; font-variant-numeric: tabular-nums; }

      /* glyphs */
      .g { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
      .g.passed, .g.done { color: var(--green); }
      .g.failed { color: var(--red); }
      .g.errored { color: var(--amber); }
      .g.pending { color: var(--ink-3); }
      .g.active { color: var(--accent); }
      .spin { transform-origin: 8px 8px; animation: spin 0.9s linear infinite; }
      body[data-state='completed'] .spin { animation: none; }
      body[data-state='completed'] .live-only { display: none; }

      /* header */
      .app { height: 100%; display: grid; grid-template-rows: 64px 1fr; }
      header {
        display: flex; align-items: center; gap: 32px;
        padding: 0 40px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .meta-list { display: flex; gap: 24px; color: var(--ink-2); }
      .meta-list b { color: var(--ink); font-weight: 500; }
      .state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 0; }
      body[data-state='evaluating'] .state-dot { background: var(--amber); }
      body[data-state='completed'] .state-dot { background: var(--green); }
      header .end { margin-left: auto; display: flex; align-items: center; gap: 16px; }
      .only-evaluating, .only-completed { display: none !important; }
      body[data-state='evaluating'] .only-evaluating { display: inline-flex !important; }
      body[data-state='completed'] .only-completed { display: inline-flex !important; }
      .quiet { align-items: center; gap: 8px; color: var(--ink-2); }
      .btn {
        display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px;
        border-radius: var(--r); border: 1px solid var(--line); background: var(--panel);
        transition: background 0.15s, border-color 0.15s;
      }
      .btn:hover { background: var(--hover); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: #184e58; }

      /* main */
      main { min-height: 0; overflow-y: auto; padding: 24px 40px; display: flex; flex-direction: column; }
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; height: 24px; margin-bottom: 8px; }
      .sec-head h2 { font-size: 12px; font-weight: 600; color: var(--ink); }
      .sec-head .eyebrow { font-weight: 400; }
      .section + .section { margin-top: 24px; }
      .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }

      .card {
        height: 128px; padding: 16px; display: flex; flex-direction: column; gap: 4px;
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
        transition: border-color 0.15s, background 0.15s;
      }
      .card:hover { border-color: rgba(0, 0, 0, 0.22); }
      .card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .card .top { display: flex; align-items: center; justify-content: space-between; height: 16px; }
      .card .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card .sub { font-size: 12px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card .foot { margin-top: auto; font-size: 12px; color: var(--ink-2); text-align: right; }
      .card .foot b { color: var(--ink); font-weight: 500; }
      .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .avatar {
        width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center;
        background: var(--accent-soft); color: var(--accent); font-weight: 600;
      }
      .avatar.sm { width: 20px; height: 20px; font-size: 11px; }
      .who .ttl { display: block; }
      .now { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
      .now span { overflow: hidden; text-overflow: ellipsis; }

      /* compact strips (in sandbox) */
      .strip { display: grid; grid-template-columns: 80px repeat(5, minmax(0, 1fr)); gap: 8px; align-items: center; }
      .strip + .strip { margin-top: 8px; }
      .strip .eyebrow { font-weight: 600; color: var(--ink); }
      .chipc {
        height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; min-width: 0;
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); white-space: nowrap;
        transition: border-color 0.15s;
      }
      .chipc:hover { border-color: rgba(0, 0, 0, 0.22); }
      .chipc.on { border-color: var(--accent); color: var(--accent); }
      .chipc .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .chipc .m { font-size: 12px; color: var(--ink-3); }

      /* detail panel */
      .detail { position: relative; margin-top: 16px; animation: drop 0.25s var(--ease) both; }
      .detail .caret {
        position: absolute; top: -7px; width: 14px; height: 14px; background: var(--panel);
        border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); transform: rotate(45deg);
        left: calc((100% - 96px) / 5 * (var(--i) + 0.5) + 24px * var(--i) - 7px); z-index: 1;
        transition: left 0.25s var(--ease);
      }
      .detail .box {
        background: var(--panel); border: 1px solid var(--accent); border-radius: var(--r);
        display: grid; grid-template-columns: 1fr 1fr; max-height: 320px;
      }
      .detail .col { padding: 24px; overflow-y: auto; min-height: 0; }
      .detail .col + .col { border-left: 1px solid var(--line); }
      .detail h3 { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 4px 0 16px; }
      .dhead { display: flex; justify-content: space-between; align-items: center; }
      .x { width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink-2); }
      .x:hover { background: var(--hover); color: var(--ink); }
      blockquote.q { padding-left: 16px; border-left: 2px solid var(--line); color: var(--ink-2); margin-bottom: 16px; }
      .facts { display: grid; grid-template-columns: 80px 1fr; gap: 8px 16px; }
      .facts dt { font-size: 12px; color: var(--ink-3); padding-top: 1px; }
      .facts code { background: var(--page); padding: 2px 8px; border-radius: 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--r); color: var(--ink-2); }

      /* rows: glyph · title · right meta */
      .rows-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
      .rows li + li { border-top: 1px solid var(--line); }
      .row {
        width: 100%; display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center;
        height: 40px; padding: 0 8px; border-radius: var(--r); transition: background 0.15s;
      }
      .row:hover:not(:disabled) { background: var(--hover); }
      .row.on { background: var(--accent-soft); color: var(--accent); }
      .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .meta { font-size: 12px; color: var(--ink-2); text-align: right; }

      /* sandbox */
      .sandbox {
        flex: 1; min-height: 0; margin-top: 16px; display: grid; grid-template-rows: auto 1fr auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
        animation: drop 0.25s var(--ease) both;
      }
      .sandbox[hidden] { display: none; }
      .sb-top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
      .sb-top .kind { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
      .tchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
      .tchip {
        display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; flex: none;
        border: 1px solid var(--line); border-radius: var(--r); white-space: nowrap; transition: border-color 0.15s, background 0.15s;
      }
      .tchip:hover:not(:disabled) { background: var(--hover); }
      .tchip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
      .dot.hardware { background: var(--violet); }
      .dot.firmware { background: var(--accent); }
      .dot.interaction { background: var(--amber); }
      .sb-body { min-height: 0; display: grid; grid-template-columns: 3fr 2fr; }
      .viewport {
        position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        cursor: grab; background: #f3f3f1; overflow: hidden; user-select: none; touch-action: none;
      }
      .viewport.dragging { cursor: grabbing; }
      .stage-wrap { position: relative; height: 72%; aspect-ratio: 180 / 320; }
      .stage-wrap::after {
        content: ''; position: absolute; left: 10%; right: 10%; bottom: -24px; height: 24px; border-radius: 50%;
        background: rgba(0, 0, 0, 0.12); filter: blur(10px); z-index: 0;
      }
      .stage { position: relative; z-index: 1; width: 100%; height: 100%; transition: transform 0.3s var(--ease); }
      .stage svg { width: 100%; height: 100%; display: block; }
      .stage .key, .stage .screen text, .stage .fx { transition: transform 0.3s var(--ease), opacity 0.3s var(--ease); transform-box: fill-box; transform-origin: center; }
      .stage .fx { opacity: 0; }
      .stage .key.pressed rect { fill: #4f8a95; }
      .viewport.after-move_button .key-select { transform: translateY(16px); }
      .viewport.after-resize_text .screen text { transform: scale(1.5); }
      .viewport.after-confirm_dialog .fx-dialog, .viewport.after-change_timeout .fx-timeout, .viewport.after-add_audio_cue .fx-audio { opacity: 1; }
      .vp-hint { position: absolute; left: 16px; bottom: 16px; font-size: 12px; color: var(--ink-3); }
      .seg { display: inline-flex; margin-top: 40px; border: 1px solid var(--line); border-radius: var(--r); padding: 2px; background: var(--panel); }
      .seg[hidden] { display: none; }
      .seg button { height: 28px; padding: 0 16px; border-radius: 8px; color: var(--ink-2); transition: background 0.15s, color 0.15s; }
      .seg button.on { background: var(--accent); color: #fff; }
      .side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); padding: 24px; display: flex; flex-direction: column; gap: 24px; }
      .side > * { animation: fade 0.2s var(--ease) both; }
      .block + .block { border-top: 1px solid var(--line); padding-top: 24px; }
      .pcard { display: flex; align-items: center; gap: 12px; }
      .pcard .ttl { font-weight: 600; }
      .pill { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent); }
      .action { font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; margin: 8px 0; animation: fade 0.2s var(--ease) both; }
      .frame { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
      .frame svg { display: block; width: 100%; }
      .frame figcaption { font-size: 12px; color: var(--ink-2); padding: 8px 12px; }
      .fail-h { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
      .stitle { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 8px 0; }
      .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
      .change { margin-top: 16px; padding: 8px 12px; background: var(--page); border-radius: var(--r); }

      .transport { display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 16px; border-top: 1px solid var(--line); }
      .transport[hidden] { display: none; }
      .play { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
      .transport input[type='range'] { width: 200px; flex: none; accent-color: var(--accent); cursor: pointer; }
      .pos { width: 48px; flex: none; font-size: 12px; color: var(--ink-2); text-align: right; }
      .steps { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
      .steps button { flex: none; height: 28px; padding: 0 12px; font-size: 12px; border: 1px solid var(--line); border-radius: var(--r); color: var(--ink-3); white-space: nowrap; transition: all 0.15s; }
      .steps button.done { color: var(--ink); background: var(--page); }
      .steps button.next { border-color: var(--accent); color: var(--accent); }
      .steps button:hover { border-color: rgba(0, 0, 0, 0.3); }
      .steps sup { margin-right: 4px; color: var(--ink-3); font-size: 11px; vertical-align: 0; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      }
      @media (max-width: 1240px) {
        main, header { padding-left: 32px; padding-right: 32px; }
        .grid { gap: 16px; }
        .detail .caret { left: calc((100% - 64px) / 5 * (var(--i) + 0.5) + 16px * var(--i) - 7px); }
        .meta-list .opt { display: none; }
      }
    </style>
  </head>
  <body data-state="running">
    <div class="app">
      <header>
        <h1>Infallible</h1>
        <div class="meta-list">
          <span>Run <b><code id="run-id"></code></b></span>
          <span><i class="state-dot"></i><b id="run-state"></b></span>
          <span>Started <b id="run-started"></b></span>
          <span class="opt"><b id="n-agents"></b> personas · <b id="n-tasks"></b> tasks · <b id="n-done"></b> done</span>
        </div>
        <div class="end">
          <span class="quiet only-evaluating"><svg class="g active" viewBox="0 0 16 16"><circle class="spin" cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="26 12" /></svg>Evaluating results</span>
          <button class="btn primary only-completed" id="see-sug">See suggestions (<span id="n-sug"></span>)</button>
        </div>
      </header>

      <main>
        <div id="dash">
          <section class="section">
            <div class="sec-head"><h2>Tasks</h2><span class="eyebrow" id="tasks-count"></span></div>
            <div class="grid" id="task-grid"></div>
            <div id="slot-task"></div>
          </section>
          <section class="section">
            <div class="sec-head"><h2>Personas</h2><span class="eyebrow" id="personas-count"></span></div>
            <div class="grid" id="agent-grid"></div>
            <div id="slot-agent"></div>
          </section>
        </div>
        <div id="strips" hidden></div>

        <section class="sandbox" id="sandbox" hidden>
          <div class="sb-top">
            <button class="btn" id="sb-back"><svg class="g" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3 5 8l5 5" /></svg>Back</button>
            <div class="tchips" id="sb-chips"></div>
            <span class="kind" id="sb-kind"></span>
          </div>
          <div class="sb-body">
            <div class="viewport" id="viewport">
              <div class="stage-wrap"><div class="stage" id="stage"></div></div>
              <div class="seg" id="seg" hidden><button data-after="0">Before</button><button data-after="1">After</button></div>
              <span class="vp-hint">Drag to orbit · scroll to zoom</span>
            </div>
            <aside class="side" id="side"></aside>
          </div>
          <footer class="transport" id="transport" hidden>
            <button class="play" id="play" aria-label="Play or pause">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path id="play-icon" d="M5 3.5v9M11 3.5v9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
            <input type="range" id="scrub" min="0" max="10" value="0" aria-label="Scrub steps" />
            <span class="pos" id="pos"></span>
            <ol class="steps" id="steps"></ol>
          </footer>
        </section>
      </main>
    </div>

    <script src="_shared/mock.js"></script>
    <script>
      const M = window.MOCK;
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const st = () => document.body.dataset.state || 'running';

      const G = {
        passed: '<circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2 7.2 10 10.8 6"/>',
        done: '<circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2 7.2 10 10.8 6"/>',
        failed: '<circle cx="8" cy="8" r="6.5"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4"/>',
        errored: '<path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3M8 11.4v.1"/>',
        pending: '<circle cx="8" cy="8" r="6.5" stroke-dasharray="2 2.6"/>',
        active: '<circle class="spin" cx="8" cy="8" r="6" stroke-dasharray="26 12"/>',
        disabled: '<circle cx="8" cy="8" r="6.5" stroke-dasharray="2 2.6"/>',
      };
      const glyph = (s) => `<svg class="g ${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="${s}">${G[s] || G.pending}</svg>`;
      const pad = (n) => String(n).padStart(2, '0');
      const outcomeOf = (a, tid) => a.outcomes[tid] || (a.currentTaskId === tid ? 'active' : M.historyOf(a.id, tid).length ? 'pending' : 'disabled');

      let sel = null; // { kind: 'task'|'agent', id }
      let sb = null; // { kind, agentId, taskId, suggestionId }
      let replay = { cursor: 0, playing: true, timer: null };
      let after = false;
      let afterTimer = null;

      /* ---- header + dashboard ---- */
      function renderHeader() {
        $('#run-id').textContent = M.run.id.slice(0, 8);
        $('#run-state').textContent = st();
        $('#run-started').textContent = M.run.startedAt;
        $('#n-agents').textContent = M.agents.length;
        $('#n-tasks').textContent = M.tasks.length;
        $('#n-done').textContent = M.tasks.filter((t) => M.taskStatus(t.id) === 'done').length;
        $('#n-sug').textContent = M.suggestions.length;
      }

      function nowLine(a) {
        if (st() === 'completed') return `${glyph('done')}<span>done</span>`;
        if (a.status === 'error') return `${glyph('errored')}<span>${esc(a.lastError || 'error')}</span>`;
        const t = M.taskById[a.currentTaskId];
        return `${glyph('active')}<span>${esc(t ? t.short : a.status)}</span>`;
      }

      function renderDashboard() {
        renderHeader();
        const done = M.tasks.filter((t) => M.taskStatus(t.id) === 'done').length;
        $('#tasks-count').textContent = `${done} of ${M.tasks.length} done`;
        $('#personas-count').textContent = `${M.agents.length} personas`;

        if (sb) {
          $('#dash').hidden = true;
          $('#strips').hidden = false;
          const curA = sb.kind !== 'change' ? sb.agentId : null;
          const curT = sb.kind !== 'change' ? sb.taskId : null;
          $('#strips').innerHTML =
            `<div class="strip"><span class="eyebrow">Tasks</span>${M.tasks
              .map((t, i) => `<button class="chipc ${t.id === curT ? 'on' : ''}" data-task="${t.id}">${glyph(M.taskStatus(t.id))}<span class="t">${esc(t.short)}</span><span class="m">${pad(i + 1)}</span></button>`)
              .join('')}</div>` +
            `<div class="strip"><span class="eyebrow">Personas</span>${M.agents
              .map((a) => {
                const p = M.personaOf(a);
                return `<button class="chipc ${a.id === curA ? 'on' : ''}" data-agent="${a.id}"><span class="avatar sm">${esc(p.name[0])}</span><span class="t">${esc(p.name)}</span><span class="m">${a.passed}·${a.failed + a.errored}</span></button>`;
              })
              .join('')}</div>`;
          $('#strips').querySelectorAll('[data-task]').forEach((b) => b.addEventListener('click', () => { closeSandbox(); select('task', b.dataset.task); }));
          $('#strips').querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => openAgent(b.dataset.agent, null)));
          return;
        }
        $('#dash').hidden = false;
        $('#strips').hidden = true;

        $('#task-grid').innerHTML = M.tasks
          .map((t, i) => {
            const scored = M.agents.filter((a) => t.id in a.outcomes).length;
            const on = sel && sel.kind === 'task' && sel.id === t.id;
            return `<button class="card ${on ? 'on' : ''}" data-task="${t.id}" aria-expanded="${on}">
              <span class="top"><span class="eyebrow">${pad(i + 1)}</span>${glyph(M.taskStatus(t.id))}</span>
              <span class="ttl">${esc(t.short)}</span>
              <span class="sub">${esc(t.name)}</span>
              <span class="foot"><b>${scored}</b>/${M.agents.length} scored</span></button>`;
          })
          .join('');
        $('#agent-grid').innerHTML = M.agents
          .map((a) => {
            const p = M.personaOf(a);
            const on = sel && sel.kind === 'agent' && sel.id === a.id;
            return `<button class="card ${on ? 'on' : ''}" data-agent="${a.id}" aria-expanded="${on}">
              <span class="who"><span class="avatar">${esc(p.name[0])}</span><span style="min-width:0"><span class="ttl">${esc(p.name)}</span><span class="sub">${p.age} yrs</span></span></span>
              <span class="now" style="margin-top:8px">${nowLine(a)}</span>
              <span class="foot"><b>${a.passed}</b> pass · <b>${a.failed + a.errored}</b> fail</span></button>`;
          })
          .join('');
        $('#task-grid').querySelectorAll('[data-task]').forEach((b) => b.addEventListener('click', () => select('task', b.dataset.task)));
        $('#agent-grid').querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => select('agent', b.dataset.agent)));
        renderDetail();
      }

      function select(kind, id) {
        const same = sel && sel.kind === kind && sel.id === id;
        const moved = !sel || sel.kind !== kind;
        sel = same ? null : { kind, id };
        renderDashboard();
        if (!same && moved) {
          const d = $('.detail');
          if (d) d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }

      const closeIcon = '<svg class="g" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';

      function renderDetail() {
        const prev = $('.detail');
        const prevKind = prev && prev.dataset.kind;
        $('#slot-task').innerHTML = '';
        $('#slot-agent').innerHTML = '';
        if (!sel) return;
        let html;
        if (sel.kind === 'task') {
          const t = M.taskById[sel.id];
          const i = M.tasks.indexOf(t);
          html = `<div class="col">
              <div class="dhead"><span class="eyebrow">Task ${pad(i + 1)} of ${pad(M.tasks.length)}</span><button class="x" data-close aria-label="Close">${closeIcon}</button></div>
              <h3>${esc(t.name)}</h3>
              <blockquote class="q">“${esc(t.description)}”</blockquote>
              <dl class="facts"><dt>Goal</dt><dd>${esc(t.goal)}</dd><dt>Success</dt><dd><code>${esc(t.success)}</code></dd><dt>Max steps</dt><dd>${t.maxSteps}</dd></dl>
            </div>
            <div class="col">
              <div class="rows-head"><span class="eyebrow">Attempts</span><span class="eyebrow">steps</span></div>
              <ul class="rows">${M.agents
                .map((a) => {
                  const p = M.personaOf(a);
                  const o = a.outcomes[t.id] || (a.currentTaskId === t.id ? 'active' : 'pending');
                  const n = M.historyOf(a.id, t.id).length;
                  const ok = o !== 'pending' && n > 0;
                  return `<li><button class="row" data-agent="${a.id}" ${ok ? '' : 'disabled'}>${glyph(o)}<span class="title">${esc(p.name)} <span class="faint">· ${o}</span></span><span class="meta">${n || '—'}</span></button></li>`;
                })
                .join('')}</ul>
            </div>`;
        } else {
          const a = M.agentById[sel.id];
          const p = M.personaOf(a);
          html = `<div class="col">
              <div class="dhead"><span class="eyebrow">Persona ${pad(M.agents.indexOf(a) + 1)} of ${pad(M.agents.length)}</span><button class="x" data-close aria-label="Close">${closeIcon}</button></div>
              <div class="pcard" style="margin:8px 0 16px"><span class="avatar">${esc(p.name[0])}</span><div><h3 style="margin:0">${esc(p.name)}</h3><span class="dim">${p.age}, ${esc(p.gender)}</span></div><span class="pill">${esc(a.status)}</span></div>
              <blockquote class="q">${esc(p.long)}. ${esc(p.blurb)}</blockquote>
              <dl class="facts"><dt>Modifiers</dt><dd>${p.modifiers.length ? `<div class="chips">${p.modifiers.map((m) => `<span class="chip">${esc(m.label)}</span>`).join('')}</div>` : '<span class="faint">none</span>'}</dd>
              <dt>Score</dt><dd>${a.passed} pass · ${a.failed + a.errored} fail</dd></dl>
              <button class="btn primary" data-open style="margin-top:16px">Open in sandbox</button>
            </div>
            <div class="col">
              <div class="rows-head"><span class="eyebrow">Tasks</span><span class="eyebrow">steps</span></div>
              <ul class="rows">${M.tasks
                .map((t) => {
                  const o = outcomeOf(a, t.id);
                  const n = M.historyOf(a.id, t.id).length;
                  return `<li><button class="row" data-task="${t.id}" ${n ? '' : 'disabled'}>${glyph(o === 'disabled' ? 'pending' : o)}<span class="title">${esc(t.short)}</span><span class="meta">${n || '—'}</span></button></li>`;
                })
                .join('')}</ul>
            </div>`;
        }
        const idx = sel.kind === 'task' ? M.tasks.findIndex((t) => t.id === sel.id) : M.agents.findIndex((a) => a.id === sel.id);
        const slot = sel.kind === 'task' ? $('#slot-task') : $('#slot-agent');
        slot.innerHTML = `<div class="detail" data-kind="${sel.kind}" style="--i:${idx}"><span class="caret"></span><div class="box">${html}</div></div>`;
        const d = $('.detail', slot);
        if (prevKind === sel.kind) d.style.animation = 'none'; // same row: only the caret slides
        $('[data-close]', d).addEventListener('click', () => { sel = null; renderDashboard(); });
        if (sel.kind === 'task') {
          d.querySelectorAll('[data-agent]').forEach((b) => b.addEventListener('click', () => openAgent(b.dataset.agent, sel.id)));
        } else {
          const aid = sel.id;
          $('[data-open]', d).addEventListener('click', () => openAgent(aid, null));
          d.querySelectorAll('[data-task]').forEach((b) => b.addEventListener('click', () => openAgent(aid, b.dataset.task)));
        }
      }

      function openAgent(agentId, taskId) {
        const a = M.agentById[agentId];
        if (taskId && taskId in a.outcomes) return openSandbox({ kind: 'replay', agentId, taskId });
        if (st() === 'running' && a.status === 'working' && (!taskId || taskId === a.currentTaskId))
          return openSandbox({ kind: 'live', agentId, taskId: a.currentTaskId });
        const target = taskId || Object.keys(a.outcomes).pop() || a.currentTaskId;
        openSandbox({ kind: 'replay', agentId, taskId: target });
      }

      /* ---- sandbox ---- */
      function openSandbox(mode) {
        sb = mode;
        after = false;
        clearTimeout(afterTimer);
        clearInterval(replay.timer);
        replay = { cursor: 0, playing: true, timer: null };
        $('#sandbox').hidden = false;
        $('#stage').dataset.screen = '';
        renderDashboard();
        renderSandbox();
        if (mode.kind === 'replay') startReplay();
      }
      function closeSandbox() {
        clearInterval(replay.timer);
        clearTimeout(afterTimer);
        sb = null;
        $('#sandbox').hidden = true;
        renderDashboard();
      }
      $('#sb-back').addEventListener('click', closeSandbox);
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (sb) closeSandbox();
        else if (sel) { sel = null; renderDashboard(); }
      });
      $('#see-sug').addEventListener('click', () => openSandbox({ kind: 'change', suggestionId: M.suggestions[0].id }));

      const stepsFor = () => (sb && sb.kind !== 'change' ? M.historyOf(sb.agentId, sb.taskId) : []);

      function renderSandbox() {
        const side = $('#side');
        const steps = stepsFor();
        $('#transport').hidden = sb.kind !== 'replay';
        $('#seg').hidden = sb.kind !== 'change';
        $('#viewport').className = 'viewport';

        if (sb.kind === 'change') {
          const s = M.suggestions.find((x) => x.id === sb.suggestionId);
          $('#sb-kind').textContent = `Suggestion ${M.suggestions.indexOf(s) + 1} of ${M.suggestions.length}`;
          $('#sb-chips').innerHTML = M.suggestions
            .map((x, i) => `<button class="tchip ${x.id === s.id ? 'on' : ''}" data-sug="${x.id}"><span class="dot ${x.category}"></span>${pad(i + 1)} · ${esc(x.title)}</button>`)
            .join('');
          $('#sb-chips').querySelectorAll('[data-sug]').forEach((b) => b.addEventListener('click', () => openSandbox({ kind: 'change', suggestionId: b.dataset.sug })));
          $('#stage').innerHTML = M.pumpSvg({ screen: 'bolus' });
          injectFx();
          const params = JSON.stringify(s.change.params).replace(/[{}"]/g, '').replace(/,/g, ', ').replace(/:/g, ': ');
          side.innerHTML = `
            <div class="block">
              <span class="tag"><span class="dot ${s.category}"></span>${s.category}</span>
              <h3 class="stitle">${esc(s.title)}</h3>
              <p class="dim">${esc(s.rationale)}</p>
              <div class="change"><code>${esc(s.change.type)}</code><br /><code class="dim">${esc(params)}</code></div>
            </div>
            <div class="block">
              <div class="rows-head"><span class="eyebrow">Evidence</span><span class="eyebrow">${s.evidence.length}</span></div>
              <ul class="rows">${s.evidence
                .map((e) => {
                  const a = M.agentById[e.agentId];
                  return `<li><button class="row" data-ev-agent="${e.agentId}" data-ev-task="${e.taskId}">${glyph(a.outcomes[e.taskId] || 'pending')}<span class="title">${esc(M.personaOf(a).name)} <span class="faint">· ${esc(M.taskById[e.taskId].short)}</span></span><span class="meta">§${e.step}</span></button></li>`;
                })
                .join('')}</ul>
            </div>`;
          side.querySelectorAll('[data-ev-agent]').forEach((b) => b.addEventListener('click', () => openSandbox({ kind: 'replay', agentId: b.dataset.evAgent, taskId: b.dataset.evTask })));
          setAfter(false, s);
          afterTimer = setTimeout(() => { if (sb && sb.kind === 'change' && sb.suggestionId === s.id) setAfter(true, s); }, 900);
          return;
        }

        const a = M.agentById[sb.agentId];
        const p = M.personaOf(a);
        const t = M.taskById[sb.taskId];
        const outcome = a.outcomes[sb.taskId];
        $('#sb-kind').textContent = sb.kind === 'live' ? 'Live' : 'Replay';
        $('#sb-chips').innerHTML = M.tasks
          .map((x) => {
            const o = outcomeOf(a, x.id);
            const live = a.currentTaskId === x.id && !a.outcomes[x.id];
            const has = M.historyOf(a.id, x.id).length > 0;
            return `<button class="tchip ${x.id === sb.taskId ? 'on' : ''}" data-task="${x.id}" data-live="${live ? 1 : 0}" ${has ? '' : 'disabled'}>${glyph(o === 'disabled' ? 'pending' : o)}${esc(x.short)}</button>`;
          })
          .join('');
        $('#sb-chips').querySelectorAll('[data-task]').forEach((b) =>
          b.addEventListener('click', () => openSandbox({ kind: b.dataset.live === '1' ? 'live' : 'replay', agentId: a.id, taskId: b.dataset.task })),
        );

        side.innerHTML = `
          <div class="block">
            <div class="pcard"><span class="avatar">${esc(p.name[0])}</span><div><div class="ttl">${esc(p.name)}</div><span class="dim">${p.age}, ${esc(p.gender)}</span></div><span class="pill">${esc(a.status)}</span></div>
            ${p.modifiers.length ? `<div class="chips" style="margin-top:12px">${p.modifiers.map((m) => `<span class="chip">${esc(m.label)}</span>`).join('')}</div>` : ''}
          </div>
          <div class="block" id="step-card"></div>
          ${
            outcome === 'failed' || outcome === 'errored'
              ? `<div class="block"><div class="fail-h">${glyph(outcome)}${outcome === 'errored' ? 'Errored' : 'Failed'}</div><p class="dim">${esc(a.reasons[sb.taskId] || 'No reason reported.')}</p></div>`
              : ''
          }`;
        renderStep();

        if (sb.kind === 'replay') {
          $('#scrub').max = steps.length;
          $('#steps').innerHTML = steps.map((s, i) => `<li><button data-i="${i}"><sup>${i + 1}</sup>${esc(s.action)}</button></li>`).join('');
          $('#steps').querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => scrub(Number(b.dataset.i) + 1)));
          renderTransport();
        }
      }

      function screenFor(cursor, steps, t) {
        if (!steps.length) return 'home';
        if (cursor === 0) return t && t.id === 't-alarm' ? 'alarm' : 'home';
        const seen = steps.slice(0, cursor).map((s) => s.action);
        if (t && t.id === 't-basal' && seen.some((x) => x === 'press select')) return 'basal';
        if (seen.some((x) => x.startsWith('hold up') || x === 'press up')) return 'bolus';
        if (seen.some((x) => x === 'press select')) return 'home';
        return t && t.id === 't-alarm' ? 'alarm' : 'home';
      }

      function renderStep() {
        const steps = stepsFor();
        const shown = sb.kind === 'live' ? steps.length : replay.cursor;
        const cur = steps[shown - 1];
        const t = M.taskById[sb.taskId];
        const a = M.agentById[sb.agentId];
        const screen = screenFor(shown, steps, t);
        $('#step-card').innerHTML = `
          <span class="eyebrow">${sb.kind === 'replay' ? `Step ${shown} of ${steps.length}` : `Step ${shown}`} · ${esc(t ? t.short : '')}</span>
          <div class="action">${cur ? esc(cur.action) : 'waiting to start'}</div>
          ${cur && cur.reasoning ? `<blockquote class="q" style="margin:0">“${esc(cur.reasoning)}”</blockquote>` : ''}
          ${sb.kind === 'live' ? `<figure class="frame">${M.frameSvg(a.personaId, { screen })}<figcaption>Agent's view · heard confirmation beep</figcaption></figure>` : ''}`;
        const stage = $('#stage');
        const m = cur && cur.action.match(/^(press|hold) (\w+)/);
        if (stage.dataset.screen !== screen) {
          stage.dataset.screen = screen;
          stage.innerHTML = M.pumpSvg({ screen });
        }
        stage.querySelectorAll('[data-button]').forEach((k) => k.classList.toggle('pressed', !!m && k.dataset.button === m[2]));
      }

      /* replay transport */
      function startReplay() {
        clearInterval(replay.timer);
        replay.timer = setInterval(() => {
          if (!replay.playing) return;
          if (replay.cursor >= stepsFor().length) {
            replay.playing = false;
            renderTransport();
            return;
          }
          replay.cursor += 1;
          renderStep();
          renderTransport();
        }, 1100);
      }
      function scrub(n) {
        replay.playing = false;
        replay.cursor = n;
        renderStep();
        renderTransport();
      }
      function renderTransport() {
        const n = stepsFor().length;
        const playing = replay.playing && replay.cursor < n;
        $('#scrub').value = replay.cursor;
        $('#pos').textContent = `${replay.cursor}/${n}`;
        $('#play-icon').setAttribute('d', playing ? 'M5 3.5v9M11 3.5v9' : 'M5 3.5v9l7-4.5z');
        $('#play-icon').setAttribute('fill', playing ? 'none' : 'currentColor');
        $('#steps').querySelectorAll('button').forEach((b, i) => {
          b.className = i < replay.cursor ? 'done' : i === replay.cursor ? 'next' : '';
          if (i === replay.cursor) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
        });
      }
      $('#play').addEventListener('click', () => {
        if (replay.cursor >= stepsFor().length) {
          replay.cursor = 0;
          replay.playing = true;
          renderStep();
        } else replay.playing = !replay.playing;
        renderTransport();
      });
      $('#scrub').addEventListener('input', (e) => scrub(Number(e.target.value)));

      /* change mode */
      function injectFx() {
        $('#stage svg').insertAdjacentHTML(
          'beforeend',
          `<g class="fx fx-dialog"><rect x="30" y="52" width="120" height="60" rx="4" fill="#0b1118" stroke="#9fb3c8"/><text x="90" y="74" text-anchor="middle" font-size="8" fill="#e8f0f8" font-family="system-ui">You delivered 0.5 U 20 s ago.</text><text x="90" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#ffb84d" font-family="system-ui">Deliver again?</text><text x="90" y="104" text-anchor="middle" font-size="7.5" fill="#9fb3c8" font-family="system-ui">BACK = no · SELECT = yes</text></g>` +
            `<g class="fx fx-timeout"><rect x="118" y="38" width="38" height="14" rx="3" fill="#1f5f6b"/><text x="137" y="48" text-anchor="middle" font-size="8" fill="#fff" font-family="system-ui">90 s</text></g>` +
            `<g class="fx fx-audio" fill="none" stroke="#ffb84d" stroke-width="1.5"><circle cx="22" cy="22" r="9"/><circle cx="22" cy="22" r="15" opacity=".6"/><circle cx="22" cy="22" r="21" opacity=".3"/></g>`,
        );
      }
      function setAfter(v, s) {
        after = v;
        $('#seg').querySelectorAll('[data-after]').forEach((b) => b.classList.toggle('on', (b.dataset.after === '1') === v));
        $('#viewport').className = 'viewport' + (v ? ' after-' + s.change.type : '');
      }
      $('#seg').querySelectorAll('[data-after]').forEach((b) =>
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          clearTimeout(afterTimer);
          setAfter(b.dataset.after === '1', M.suggestions.find((x) => x.id === sb.suggestionId));
        }),
      );
      $('#seg').addEventListener('pointerdown', (e) => e.stopPropagation());

      /* cosmetic orbit */
      (function orbit() {
        const vp = $('#viewport');
        const stage = $('#stage');
        let drag = null;
        let rx = -4;
        let ry = 12;
        let z = 1;
        const apply = () => (stage.style.transform = `perspective(1100px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${z})`);
        apply();
        vp.addEventListener('pointerdown', (e) => {
          drag = { x: e.clientX, y: e.clientY, rx, ry };
          vp.classList.add('dragging');
          stage.style.transition = 'none';
        });
        window.addEventListener('pointermove', (e) => {
          if (!drag) return;
          ry = drag.ry + (e.clientX - drag.x) * 0.4;
          rx = Math.max(-40, Math.min(40, drag.rx - (e.clientY - drag.y) * 0.3));
          apply();
        });
        window.addEventListener('pointerup', () => {
          drag = null;
          vp.classList.remove('dragging');
          stage.style.transition = '';
        });
        vp.addEventListener('wheel', (e) => {
          e.preventDefault();
          z = Math.max(0.6, Math.min(1.6, z - e.deltaY * 0.001));
          apply();
        }, { passive: false });
      })();

      /* mock controls */
      document.addEventListener('mock:state', renderDashboard);
      document.addEventListener('mock:open', (e) => {
        const k = e.detail.kind;
        if (k === 'dashboard') return sb ? closeSandbox() : renderDashboard();
        if (k === 'change') return openSandbox({ kind: 'change', suggestionId: M.defaults.change.suggestionId });
        openSandbox({ kind: k, ...M.defaults[k] });
      });

      renderDashboard();
      M.mountControls();
    </script>
  </body>
</html>

[project]
name = "infallible-contracts"
version = "0.1.0"
description = "Shared wire contracts (pydantic models) for every Infallible component."
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "infallible_contracts"

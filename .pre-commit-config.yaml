# Polyglot git hooks. Install once:  uv run pre-commit install
#   pre-commit  — fast, staged-files-only: whitespace, formatters, linters, secrets
#   commit-msg  — Conventional Commits
#   pre-push    — slower, whole-project: type checks, tests, clippy, contract drift
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: '4.0.0'
exclude: ^(packages/contracts-ts/src/generated\.ts|packages/contracts-ts/schema/|pnpm-lock\.yaml|uv\.lock)

repos:
  # ---------------------------------------------------------------- generic
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ----------------------------------------------------------------- python
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.33
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ----------------------------------------------------------------- docker / CI
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [--ignore, DL3018] # unpinned apk packages (none installed today)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ----------------------------------------------------------------- local toolchains
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, css, html]

      - id: eslint
        name: eslint (visualizer, contracts-ts, assets)
        entry: pnpm exec eslint --fix --max-warnings=0
        language: system
        files: ^(apps/visualizer/src|packages/contracts-ts|assets)/.*\.(ts|tsx|js|mjs)$

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path apps/visualizer/src-tauri/Cargo.toml --
        language: system
        types: [rust]

      - id: contracts-drift
        name: regenerate TS contracts from Python models
        entry: pnpm contracts:gen
        language: system
        files: ^packages/contracts/src/
        pass_filenames: false

      # ------------------------------------------------------------- pre-push
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: ts-checks
        name: lint + typecheck + test (TS workspaces)
        entry: pnpm prepush:ts
        language: system
        types_or: [ts, tsx, javascript, json]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path apps/visualizer/src-tauri/Cargo.toml --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

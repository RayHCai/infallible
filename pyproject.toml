# Root of the Python half of the monorepo. This is a *virtual* workspace root:
# it is never built or installed itself, it only owns shared tooling config and
# the single lockfile (uv.lock) for every Python member below.

[project]
name = "infallible-workspace"
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false
python-preference = "managed"
required-version = ">=0.11"

[tool.uv.workspace]
members = [
  "apps/driver",
  "apps/agent-persona",
  "apps/firmware",
  "packages/contracts",
  "scripts",
]

[tool.uv.sources]
infallible-contracts = { workspace = true }
infallible-driver = { workspace = true }
infallible-agent-persona = { workspace = true }
infallible-firmware = { workspace = true }
infallible-scripts = { workspace = true }

[dependency-groups]
dev = [
  # Installs every member (editable) into the root .venv so a single
  # `uv sync` gives tests, mypy and the IDE a view over the whole repo.
  "infallible-contracts",
  "infallible-driver[agents]",
  "infallible-agent-persona[local-firmware]",
  "infallible-firmware",
  "infallible-scripts",
  "fakeredis>=2.26",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "types-pyserial>=3.5",
  "types-pyyaml>=6.0",
]

# --------------------------------------------------------------------------- #
# Ruff — lint + format for every Python member                                #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py314"
src = [
  "apps/driver/src",
  "apps/agent-persona/src",
  "apps/firmware/src",
  "packages/contracts/src",
]
extend-exclude = ["apps/scanner", "apps/visualizer", "packages/contracts-ts"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "S",         # bandit
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return
  "PIE",
  "PT",        # pytest style
  "PTH",       # pathlib over os.path
  "TID",       # tidy imports
  "TC",        # type-checking imports
  "ASYNC",     # async pitfalls
  "T20",       # no print()
  "ERA",       # commented-out code
  "PERF",
  "RUF",
]
ignore = [
  "E501", # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "S311"]
"scripts/**" = ["T20"]
# FastAPI resolves route/dependency annotations at runtime.
"apps/driver/src/driver/api/*.py" = ["TC001", "TC002", "TC003"]
"apps/firmware/src/firmware/host/app.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["driver", "agent_persona", "firmware", "infallible_contracts"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
  "infallible_contracts._base.Contract",
]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy                                                                        #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = [
  "apps/driver/src",
  "apps/agent-persona/src",
  "apps/firmware/src",
  "packages/contracts/src",
]

[[tool.mypy.overrides]]
module = ["qrcode.*", "trimesh.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest                                                                      #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "packages/contracts/tests",
  "apps/driver/tests",
  "apps/agent-persona/tests",
  "apps/firmware/tests",
]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["driver", "agent_persona", "firmware", "infallible_contracts"]

[tool.coverage.report]
skip_empty = true
show_missing = true

tasks:
- id: 103a5f49-2cb8-50a9-a4d8-a136395dc2b9
  name: Lunch Bolus With Low Reservoir Alarm
  description: 'I''m about to eat lunch and need to take 4.5 units before I start.
    The pump just beeped with a low reservoir warning and I only have about 18 units
    left. I want to clear the warning, dial in exactly 4.5 units, and make sure it
    actually goes in. Only once, though: if the warning comes back I don''t want to
    accidentally give it twice.'
  goal: Before eating lunch, deliver a single meal bolus of exactly 4.5 U. The pump
    is currently showing a low reservoir alarm with about 18 U remaining. Acknowledge
    the alarm, go to the Bolus menu, set the amount to 4.5 U (not more, not less),
    and confirm it so it is actually delivered. Don't leave the entry screen idle,
    because an unconfirmed entry is silently discarded after 30 seconds. After delivery,
    do not give a second bolus even if the low reservoir warning reappears. Check
    the screen to see whether the first one went through.
  initial_state:
    screen: alarm
    pending_bolus_units: 0.0
    bolus_units: 0.0
    basal_rate: 0.8
    reservoir_units: 18.0
    battery_pct: 64
    alarms:
    - low_reservoir
  success: bolus_units >= 4.45 and bolus_units <= 4.55 and reservoir_units >= 13.45
    and reservoir_units <= 13.55
  max_steps: 80
- id: 38562cca-7202-595b-ad2e-1b30dee437fd
  name: Fill New Cannula After Site Change With Low Reservoir Alarm
  description: I just pulled my old infusion set and put a new one in on my belly,
    then clicked the tubing back onto the set. My cartridge still has a bit of insulin
    in it, so I only changed the site, and the pump is beeping about the reservoir
    being low. My trainer told me that after every new set goes in, I have to fill
    the little cannula with 0.5 units or I won't get my insulin. I just want to take
    care of the beeping and fill the cannula with exactly 0.5 units, once, and not
    a drop more.
  goal: 'You have just finished a site-only change: the new infusion set is inserted
    and the tubing is reconnected. The pump is showing a low reservoir alarm. Clear
    the alarm, then fill the new cannula by delivering exactly 0.5 U through the Bolus
    menu and confirming it. Deliver it only once, do not give any larger amount, and
    do not let the entry sit unconfirmed long enough to time out.'
  initial_state:
    screen: alarm
    pending_bolus_units: 0.0
    bolus_units: 4.2
    basal_rate: 0.85
    reservoir_units: 18.0
    battery_pct: 64
    alarms:
    - low_reservoir
  success: bolus_units > 0.45 and bolus_units < 0.55 and pending_bolus_units == 0
    and reservoir_units > 17.4 and reservoir_units < 17.6
  max_steps: 30
- id: f05b41a3-860f-514b-b68a-9b033089da30
  name: Meal Bolus Before Overdue Cartridge Change
  description: My pump started beeping that insulin is low. I'm about to sit down
    to eat and I don't have time to swap the cartridge before the meal. I want to
    silence the alarm, get my meal dose in from what's left, and check my basal rate
    so I know how long the rest will last until I change the cartridge right after
    dinner. I don't want any extra insulin going in, like a leftover 'priming' push
    or a double dose.
  goal: The pump is showing a low insulin alarm with about 14 U left in the cartridge.
    Clear the alarm, then deliver one meal bolus of exactly 4.5 U and make sure it
    is confirmed and actually delivered, not left sitting on the entry screen. Do
    not deliver any other bolus, including a small one to 'prime' or 'test' the line.
    Afterward, open the basal screen to check your current basal rate so you can plan
    the cartridge change.
  initial_state:
    screen: alarm
    pending_bolus_units: 0.0
    bolus_units: 2.0
    basal_rate: 0.8
    reservoir_units: 14.0
    battery_pct: 70
    alarms:
    - low_reservoir
  success: bolus_units == 4.5 and reservoir_units == 9.5 and pending_bolus_units ==
    0
  max_steps: 60
- id: e86d64b4-191e-5f09-8534-b2236343bc1c
  name: Verify Backup Pump Basal Before Lunch Bolus
  description: I broke my regular pump and switched to my backup. Out of habit I already
    started keying in my usual 4.0 U lunch bolus, but I never checked whether the
    backup pump has my prescribed basal rate of 0.9 U/h. If the basal is wrong, I
    shouldn't add insulin on top of it. I should back out and call my clinic to fix
    the settings.
  goal: You are using your backup pump and have already started entering a 4.0 U lunch
    bolus. Before you confirm anything, go to the Basal screen and read the basal
    rate. Your prescribed basal rate is 0.9 U/h. If the pump shows exactly 0.9 U/h,
    go ahead and deliver the 4.0 U lunch bolus. If it shows any other rate, do not
    deliver any bolus, make sure nothing is left waiting to be delivered, and leave
    the pump on the home screen so your clinic can correct the basal settings.
  initial_state:
    screen: bolus_entry
    pending_bolus_units: 4.0
    bolus_units: 0.0
    basal_rate: 5.7
    reservoir_units: 150.0
    battery_pct: 80
    alarms: []
  success: screen == 'home' and bolus_units == 0 and pending_bolus_units == 0 and
    basal_rate == 5.7
  max_steps: 25
- id: 7223c52c-5f12-589c-8e0f-27110ae6e34f
  name: Correction Bolus After Battery Ran Flat
  description: I forgot to charge my pump and it died overnight. I woke up with a
    high reading. I've just plugged the charger in and the pump is back on, but the
    battery is nearly empty. I need to give myself a 3.0 unit correction right now
    and make sure it actually goes through, not just think I did it while fiddling
    with the charger.
  goal: 'Your pump shut off overnight because the battery ran out, and your glucose
    is high. You have already plugged in the charger and the pump is back on the home
    screen with very little charge. Deliver a 3.0 U correction bolus: go to Menu >
    Bolus, set exactly 3.0 U, and confirm it so it is actually delivered. Do not leave
    the bolus screen sitting unconfirmed, because it will quietly cancel after about
    30 seconds. When you are done, make sure the pump shows the bolus was delivered
    and is back on the home screen.'
  initial_state:
    screen: home
    pending_bolus_units: 0.0
    bolus_units: 1.5
    basal_rate: 0.9
    reservoir_units: 120.0
    battery_pct: 5
    alarms: []
  success: bolus_units == 3.0 and pending_bolus_units == 0 and screen == 'home'
  max_steps: 45
